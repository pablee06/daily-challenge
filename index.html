<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2563EB">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Daily Challenge — Multiplayer-Probeversion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F9FB; --bg-alt:#fff; --bg-alt2:#EEF0F3;
  --paper:#fff; --paper-edge:#E2E5EA;
  --accent:#2563EB; --accent-d:#1D4ED8; --accent-ink:#fff; --accent-2:#16A34A;
  --danger:#DC2626; --success:#16A34A; --peach:#D97706;
  --text:#111827; --text-dim:#6B7280; --text-faint:#9CA3AF;
  --ink:#111827; --radius:12px;
  --font-display:'Inter',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:90px;
}
::selection{background:var(--accent); color:#fff;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.wrap{max-width:640px; margin:0 auto; padding:0 16px;}

header{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--paper-edge);}
.header-inner{max-width:640px; margin:0 auto; padding:18px 16px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .stamp-title{font-family:var(--font-display); font-weight:800; letter-spacing:-0.2px; font-size:19px; line-height:1; color:var(--text); cursor:pointer;}
.brand .stamp-title span{color:var(--accent);}
.grp-btn{background:var(--bg-alt); border:1px solid var(--paper-edge); color:var(--text); border-radius:50%; width:34px; height:34px; padding:0; font-family:'Inter',sans-serif; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.header-stats{display:flex; align-items:center; gap:14px;}
.stat{text-align:right;}
.stat .n{font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--accent);}
.stat .l{font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.6px; font-weight:700;}
.day-bar{display:flex; align-items:center; justify-content:space-between; max-width:640px; margin:0 auto; padding:0 16px 14px; gap:10px;}
.day-pill{font-family:'Inter',sans-serif; font-weight:600; font-size:12px; color:var(--text-dim); background:var(--bg-alt); border:1px solid var(--paper-edge); padding:6px 12px; border-radius:20px;}
.day-pill b{color:var(--accent); font-family:var(--font-display);}
.countdown-pill{font-family:'Inter',sans-serif; font-size:12px; font-weight:600; background:var(--bg-alt); border:1px solid var(--paper-edge); color:var(--text-dim); padding:6px 12px; border-radius:20px; letter-spacing:0.1px; display:flex; align-items:center; gap:6px;}
.countdown-pill b{color:var(--accent); font-family:var(--font-display); letter-spacing:0.3px;}
.refresh-btn{background:none; border:none; color:var(--text-faint); font-size:15px; cursor:pointer; padding:4px 6px;}
.refresh-btn.spin{animation:spin 0.7s linear;}
@keyframes spin{to{transform:rotate(360deg);}}

.tabs{display:flex; justify-content:space-around; gap:2px; max-width:640px; margin:0 auto 22px; padding:0; border-bottom:1px solid var(--paper-edge); width:100%;}
.tab-btn{flex:1; background:none; border:none; color:var(--text-faint); font-family:'Inter',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.2px; padding:10px 2px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab-btn .ic{font-size:15px;}
.tab-btn.active{color:var(--accent); border-color:var(--accent);}

main{max-width:640px; margin:0 auto; padding:0 16px;}
.panel{display:none;}
.panel.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
.section-title{font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:0.1px; color:var(--text); margin:24px 0 12px; display:flex; align-items:center; gap:8px;}
.section-title:first-child{margin-top:4px;}
.section-title .rule{flex:1; height:1px; background:var(--paper-edge);}

.ticket{position:relative; background:var(--paper); color:var(--ink); border-radius:var(--radius); padding:22px 20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(17,24,39,0.06); border:1px solid var(--paper-edge);}
.ticket .perf{display:none;}
.ticket-top, .ticket-bottom{position:relative; z-index:1;}
.ticket-top{padding-bottom:14px;} .ticket-bottom{padding-top:2px;}
.ticket-cat{display:inline-block; font-family:'Inter',sans-serif; font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin-bottom:10px;}
.ticket-title{font-family:var(--font-display); font-weight:700; font-size:20px; line-height:1.3; margin:0 0 8px;}
.ticket-desc{font-size:13.5px; line-height:1.55; color:var(--text-dim); margin:0;}
.ticket-meta{display:flex; align-items:center; gap:14px; margin-top:16px; flex-wrap:wrap; padding-top:14px; border-top:1px solid var(--paper-edge);}
.ticket-by{font-family:'Inter',sans-serif; font-size:10px; opacity:0.5; margin-top:6px;}
.stamp{display:inline-flex; align-items:center; justify-content:center; flex-direction:column; width:auto; min-width:56px; height:auto; padding:2px 4px; border-radius:0; border:none; transform:none; font-family:var(--font-display); letter-spacing:0.1px; position:relative;}
.stamp::before{display:none;}
.stamp .p{font-size:20px; line-height:1; font-weight:700; color:var(--peach);} .stamp .d{font-size:9px; text-transform:uppercase; letter-spacing:0.5px; margin-top:3px; font-weight:700; color:var(--text-faint); font-family:'Inter',sans-serif;}
.stamp.easy .p{color:var(--success);} .stamp.normal .p{color:var(--peach);} .stamp.hard .p{color:var(--danger);}
.proof-tag{font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; color:var(--text-dim); border:none; padding:3px 0; border-radius:0;}
.status-tag{font-family:'Inter',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.1px; padding:6px 13px; border-radius:20px; text-transform:none;}
.status-tag.voting{background:color-mix(in srgb, var(--peach) 18%, transparent); color:var(--peach);}
.status-tag.completed{background:color-mix(in srgb, var(--success) 18%, transparent); color:var(--success);}
.status-tag.failed{background:color-mix(in srgb, var(--danger) 18%, transparent); color:var(--danger);}
.status-tag.missed{background:color-mix(in srgb, var(--danger) 18%, transparent); color:var(--danger);}

.btn{font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; border:none; border-radius:10px; padding:13px 16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%; letter-spacing:0.1px; transition:opacity .15s, transform .1s;}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.45; cursor:default;}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{opacity:0.92;}
.btn-accent{background:var(--peach); color:#fff;}
.btn-teal{background:var(--success); color:#fff;}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
.btn-ghost{background:var(--bg-alt2); color:var(--text);}

.vote-box{margin-top:14px; padding-top:14px; border-top:1px solid var(--paper-edge);}
.vote-row{display:flex; justify-content:space-between; font-family:'Inter',sans-serif; font-weight:600; font-size:11px; color:var(--text-dim); margin-bottom:6px;}
.vote-track{height:8px; border-radius:5px; background:var(--bg-alt2); overflow:hidden; display:flex;}
.vote-yes{background:var(--success); height:100%;} .vote-no{background:var(--danger); height:100%;}
.vote-avatars{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.vavatar{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; border:2px solid transparent; background:var(--bg-alt2);}
.vavatar.yes{border-color:var(--success);} .vavatar.no{border-color:var(--danger);} .vavatar.pending{opacity:0.35;}

.card{background:var(--paper); border:1px solid var(--paper-edge); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(17,24,39,0.04);}
.empty-state{background:var(--paper); border:1px dashed var(--paper-edge); border-radius:var(--radius); padding:26px 18px; text-align:center; color:var(--text-dim); font-size:13px; line-height:1.6;}
.empty-state .ic{font-size:26px; display:block; margin-bottom:8px;}

label{display:block; font-family:'Inter',sans-serif; font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-faint); margin:14px 0 6px;}
label:first-child{margin-top:0;}
input[type=text], textarea, select{width:100%; background:var(--bg-alt2); border:1.5px solid transparent; color:var(--text); border-radius:8px; padding:11px 13px; font-family:'Inter',sans-serif; font-size:14px;}
input[type=text]:focus, textarea:focus, select:focus{border-color:var(--accent); outline:none;}
textarea{resize:vertical; min-height:64px;}
.chip-row{display:flex; flex-wrap:wrap; gap:7px;}
.chip{font-family:'Inter',sans-serif; font-weight:600; font-size:11.5px; padding:7px 13px; border-radius:20px; background:transparent; color:var(--text-dim); border:1.5px solid var(--paper-edge); cursor:pointer;}
.chip.selected{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700;}
.slots-row{display:flex; gap:8px; margin-bottom:14px;}
.slot-dot{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; background:var(--bg-alt2); border:1px solid var(--paper-edge);}
.slot-dot.filled{background:var(--accent); color:#fff; border-color:var(--accent);}

.rank-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--paper-edge);}
.rank-row:last-child{border-bottom:none;}
.rank-num{font-family:var(--font-display); font-weight:700; font-size:16px; width:24px; color:var(--text-faint);}
.rank-row.me .rank-num{color:var(--accent);}
.rank-avatar{width:34px; height:34px; border-radius:50%; background:var(--bg-alt2); display:flex; align-items:center; justify-content:center; font-size:16px;}
.rank-name{flex:1; font-weight:600; font-size:13.5px;}
.rank-row.me .rank-name{color:var(--accent);}
.rank-xp{font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--text-dim);}
.period-toggle{display:flex; gap:6px; margin-bottom:14px;}
.period-toggle button{flex:1; background:var(--paper); border:1px solid var(--paper-edge); color:var(--text-dim); font-family:'Inter',sans-serif; font-weight:700; font-size:11px; padding:8px; border-radius:8px; cursor:pointer;}
.period-toggle button.active{background:var(--accent); color:#fff; border-color:var(--accent);}

.review-card{background:var(--paper); border:1px solid var(--paper-edge); border-radius:var(--radius); padding:18px; margin-bottom:12px; box-shadow:0 1px 3px rgba(17,24,39,0.04);}
.review-card h4{margin:0 0 4px; font-family:var(--font-display); font-weight:700; font-size:16px;}
.review-card .cat{font-family:'Inter',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:0.8px; color:var(--accent); text-transform:uppercase; margin-bottom:8px;}
.review-card p{font-size:13px; color:var(--text-dim); line-height:1.5; margin:0 0 12px;}
.diff-picker{display:flex; gap:8px; margin-bottom:10px;}
.diff-btn{flex:1; padding:11px 4px; border-radius:8px; border:1.5px solid var(--paper-edge); background:transparent; color:var(--text-dim); font-family:'Inter',sans-serif; font-weight:600; font-size:11px; cursor:pointer; text-align:center;}
.diff-btn b{display:block; font-family:var(--font-display); font-size:15px;}
.diff-btn.easy.selected{border-color:var(--success); color:var(--success); background:color-mix(in srgb, var(--success) 12%, transparent);}
.diff-btn.normal.selected{border-color:var(--peach); color:var(--peach); background:color-mix(in srgb, var(--peach) 12%, transparent);}
.diff-btn.hard.selected{border-color:var(--danger); color:var(--danger); background:color-mix(in srgb, var(--danger) 12%, transparent);}
.reason-select{margin-bottom:10px;}
.vote-card{background:var(--paper); border:1px solid var(--paper-edge); border-radius:var(--radius); padding:18px; margin-bottom:12px; box-shadow:0 1px 3px rgba(17,24,39,0.04);}
.vote-card h4{margin:0 0 4px; font-family:var(--font-display); font-weight:700; font-size:16px;}
.vote-card .meta{font-family:'Inter',sans-serif; font-weight:700; font-size:10.5px; color:var(--text-faint); margin-bottom:10px;}
.vote-choice{display:flex; gap:8px;}
.vote-choice .btn{flex:1;}
.vote-choice .btn.selected-vote{outline:2px solid var(--accent); outline-offset:2px;}

.log-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--paper-edge); font-size:12.5px; color:var(--text-dim);}
.log-item.chat{border-bottom:none; padding:6px 0;}
.chat-bubble{background:var(--bg-alt2); border-left:3px solid var(--accent); border-radius:10px; padding:9px 12px; display:flex; gap:10px; font-size:13px; color:var(--text); width:100%;}
.chat-bubble .day-tag{color:var(--text-faint);}
.log-item .day-tag{font-family:'Inter',sans-serif; font-weight:700; font-size:10px; color:var(--text-faint); white-space:nowrap; padding-top:1px;}
.log-item b{color:var(--text);}

nav.bottom{position:fixed; bottom:0; left:0; right:0; z-index:30; background:transparent; display:flex; justify-content:center; padding:0 16px calc(env(safe-area-inset-bottom,0) + 14px);}
nav.bottom button{flex:1; max-width:80px; background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 1px; font-family:'Inter',sans-serif; font-weight:700; font-size:9px; letter-spacing:0.1px; position:relative;}
nav.bottom button .ic{font-size:18px;}
nav.bottom button.active{color:var(--accent);}
nav.bottom{background:var(--bg-alt); border:1px solid var(--paper-edge); border-radius:18px; margin:0 auto 10px; max-width:400px; box-shadow:0 4px 16px rgba(17,24,39,0.08); padding:10px 10px calc(env(safe-area-inset-bottom,0) + 10px);}
nav.bottom .navbadge{position:absolute; top:2px; right:14%; background:var(--danger); color:#fff; font-size:8.5px; font-weight:700; border-radius:8px; padding:0 5px;}

#toast{position:fixed; top:12px; left:50%; transform:translateX(-50%) translateY(-60px); background:var(--text); color:#fff; font-weight:600; font-size:13px; padding:10px 18px; border-radius:30px; z-index:100; box-shadow:0 8px 20px rgba(0,0,0,0.2); transition:transform .35s cubic-bezier(.34,1.56,.64,1); pointer-events:none; max-width:80vw; text-align:center;}
#toast.show{transform:translateX(-50%) translateY(0);}
.hint{font-size:12px; color:var(--text-faint); line-height:1.5; margin:8px 0 0;}
.creator-note{font-size:11.5px; color:var(--text-faint); margin-top:-4px; margin-bottom:14px; line-height:1.5;}

/* onboarding */
.onboard{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
.onboard-card{width:100%; max-width:400px;}
.onboard-title{font-family:var(--font-display); font-weight:800; font-size:32px; text-align:center; margin:0 0 6px;}
.onboard-title span{color:var(--accent);}
.onboard-sub{text-align:center; color:var(--text-dim); font-size:13px; margin:0 0 30px; line-height:1.6;}
.ob-choice{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
.ob-back{background:none; border:none; color:var(--text-faint); font-family:'Inter',sans-serif; font-weight:700; font-size:11px; cursor:pointer; margin-bottom:16px; padding:0;}
.code-display{font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:3px; text-align:center; background:var(--bg-alt2); border:1px dashed var(--paper-edge); border-radius:10px; padding:16px; margin:16px 0; color:var(--accent);}

/* group modal */
.modal-overlay{position:fixed; inset:0; background:rgba(17,24,39,0.45); backdrop-filter:blur(2px); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{background:var(--bg); width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:22px 18px calc(env(safe-area-inset-bottom,0) + 20px); max-height:80vh; overflow-y:auto; border-top:1px solid var(--paper-edge);}
.modal-sheet h3{font-family:var(--font-display); font-weight:700; font-size:19px; margin:0 0 14px; display:flex; justify-content:space-between; align-items:center;}
.modal-close{background:var(--bg-alt2); border:none; color:var(--text); font-size:16px; cursor:pointer; width:28px; height:28px; border-radius:50%;}
.member-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--paper-edge);}
.member-row:last-child{border-bottom:none;}
.member-row .rank-avatar{width:30px; height:30px; font-size:14px;}

/* themes */
.theme-card{background:var(--paper); border:1.5px solid var(--paper-edge); border-radius:var(--radius); padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:12px;}
.theme-card.owned-active{border-color:var(--accent);}
.theme-swatch{width:44px; height:44px; border-radius:10px; flex-shrink:0; border:1px solid rgba(0,0,0,0.06);}
.theme-card .info{flex:1;}
.theme-card .info b{font-family:'Inter',sans-serif; font-size:13.5px; font-weight:700; display:block;}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast"></div>

<script>
/* =========================================================
   DAILY CHALLENGE — Multiplayer-Probeversion
   Echte Mitspieler statt Bots. Läuft komplett über den
   geteilten Artifact-Speicher (window.storage, shared=true) —
   jede Gruppe bekommt einen Einladungscode, alle Geräte im
   selben Code sehen denselben Zustand.

   Design-Entscheidungen (weil in der Spec offen):
   - Pool-Frische statt aktivem Verschieben: jede Aufgabe trägt
     den Zyklus, in dem sie akzeptiert wurde. "Aktueller Pool"
     = Aufgaben aus dem laufenden Zyklus, "Fallback" = ältere,
     unbenutzte Aufgaben (älteste zuerst). Nichts wird gelöscht.
   - Erstell-Slots werden nicht gespeichert, sondern aus der
     Anzahl eigener (nicht abgelehnter) Einreichungen im
     laufenden Zyklus berechnet — abgelehnte verbrauchen keinen
     Slot, genau wie besprochen.
   - Nicht versucht = feste -10 XP, unabhängig von Schwierigkeit.
   - Abstimmung: jedes Mitglied außer dem Empfänger stimmt
     wirklich ab (Ja/Nein-Button); Mehrheit entscheidet,
     Gleichstand = nicht erfüllt.
   - Um Schreibkonflikte zwischen Geräten zu vermeiden, ändert
     grundsätzlich nur der jeweils "besitzende" Spieler seine
     eigenen Daten (eigene Aufgabe, eigene Stimme, eigenes
     Prüfergebnis). Nur der Tageszähler ist eine echte
     gemeinsame Schreibaktion.
   ========================================================= */

const MISS_PENALTY = -10;
const CATS = ["Sport","Spaß","Kreativität","Sozial","Outdoor","Gaming","Alltag","Wissen","Mut","Gruppe"];
const PROOF_TYPES = [["none","Kein Nachweis"],["text","Text"],["photo","Foto"],["video","Video"]];
const DIFF = { easy:{label:"Einfach", points:10}, normal:{label:"Normal", points:25}, hard:{label:"Schwer", points:50} };
const EMOJIS = ['🦊','🐺','🦉','🐢','🦁','🐸','🐙','🦝','🐧','🦖','🐝','🦋'];
const PREDEFINED = [
  {title:"Trink heute 2 Liter Wasser", desc:"Bleib den Tag über hydriert.", category:"Alltag", proofType:"none", difficulty:"easy"},
  {title:"Mach 20 Liegestütze", desc:"Egal wann, egal wo — Hauptsache gemacht.", category:"Sport", proofType:"none", difficulty:"normal"},
  {title:"Ruf jemanden an, den du lange nicht gesprochen hast", desc:"Ein echtes Gespräch, kein Text.", category:"Sozial", proofType:"text", difficulty:"normal"},
  {title:"Geh 30 Minuten ohne Handy spazieren", desc:"Lass es zuhause oder im Flugmodus.", category:"Outdoor", proofType:"none", difficulty:"normal"},
  {title:"Lerne 5 neue Wörter in einer Fremdsprache", desc:"Notier sie dir irgendwo.", category:"Wissen", proofType:"text", difficulty:"easy"},
  {title:"Räum einen Ort auf, den du aufschiebst", desc:"Schublade, Schreibtisch, Postfach — deine Wahl.", category:"Alltag", proofType:"photo", difficulty:"hard"},
  {title:"Zeichne etwas Kreatives in 10 Minuten", desc:"Qualität egal, nur machen.", category:"Kreativität", proofType:"photo", difficulty:"easy"},
];

let identity = null;   // {code, playerId, playerName}
let S = null;          // loaded shared state snapshot
let pollTimer = null;

function currentPollDelay(){
  if(currentTab === 'vote') return 3000; // watching the vote tab — want it snappy
  const myAssign = S && S.todayAssignments && S.todayAssignments[identity.playerId];
  if(myAssign && myAssign.status === 'voting') return 3000; // my own task is mid-vote
  if(S && S.punishment) return 5000; // punishment voting tends to be a live back-and-forth too
  return 15000;
}

function schedulePoll(){
  if(pollTimer) clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    if(!document.hidden && !groupModalOpen){
      await loadState();
      render();
    }
    schedulePoll();
  }, currentPollDelay());
}
let countdownTimer = null;
let currentTab = 'dashboard';
let groupModalOpen = false;

/* ---------------- storage helpers ----------------
   Three backends, auto-selected per group:
   - window.storage: Claude's real shared server storage (only inside
     the Claude artifact preview).
   - remote blob (jsonblob.com): free, anonymous, no-account cloud
     storage — used when a group is created/joined with a "remote"
     code, so friends on different PCs (with no Claude account) can
     sync. One JSON document per group, fetched fresh and pushed back
     around each state-load cycle.
   - localStorage/sessionStorage: last-resort fallback, only syncs
     between tabs on the SAME PC.
   "shared:false" data (device identity, personal tracker) always
   stays device-local (sessionStorage), regardless of backend.
*/
const HAS_CLAUDE_STORAGE = (typeof window !== 'undefined' && !!window.storage);
const REMOTE_BASE = 'https://jsonblob.com/api/jsonBlob';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby2iv0L8tj1vSay2dp-_r99A9eAp9XbAFExqbmmZZqQQ4L8EN7yF3G1E4L4SxNWqRe1/exec';
function hasAppsScript(){ return !!APPS_SCRIPT_URL; }
async function appsScriptFetch(code){
  const res = await fetch(`${APPS_SCRIPT_URL}?code=${encodeURIComponent(code)}`);
  if(!res.ok) throw new Error('fetch failed: ' + res.status);
  const text = await res.text();
  remoteDoc = text ? JSON.parse(text) : {};
  remoteDirty = false;
}
async function appsScriptCheckPassword(code, pwProof){
  const res = await fetch(`${APPS_SCRIPT_URL}?code=${encodeURIComponent(code)}&checkpw=${encodeURIComponent(pwProof||'')}`);
  if(!res.ok) throw new Error('check failed: ' + res.status);
  return await res.json(); // {hasPassword, valid}
}
async function appsScriptPush(code){
  const res = await fetch(APPS_SCRIPT_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({code, data: remoteDoc, pw: (identity && identity.pwProof) || ''})
  });
  if(!res.ok) throw new Error('push failed: ' + res.status);
  const result = await res.json();
  if(result && result.ok === false){ throw new Error(result.error || 'rejected'); }
  remoteDirty = false;
}
let remoteDoc = {};
let remoteDirty = false;
let remoteBlobId = null;
let remoteAvailable = false;

async function remoteCreate(){
  const res = await fetch(REMOTE_BASE, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({})
  });
  if(!res.ok) throw new Error('create failed: ' + res.status);
  const loc = res.headers.get('Location') || res.headers.get('location');
  if(!loc) throw new Error('no blob id returned');
  const parts = loc.split('/');
  return parts[parts.length - 1];
}
async function remoteFetch(){
  if(identity && identity.backend === 'appsscript'){ return appsScriptFetch(remoteBlobId); }
  const res = await fetch(`${REMOTE_BASE}/${remoteBlobId}`);
  if(!res.ok) throw new Error('fetch failed: ' + res.status);
  remoteDoc = await res.json();
  remoteDirty = false;
}
async function remoteFlush(){
  if(!remoteDirty) return;
  if(identity && identity.backend === 'appsscript'){ return appsScriptPush(remoteBlobId); }
  const res = await fetch(`${REMOTE_BASE}/${remoteBlobId}`, {
    method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(remoteDoc)
  });
  if(!res.ok) throw new Error('push failed: ' + res.status);
  remoteDirty = false;
}

function isRemote(){ return !!(identity && identity.remote); }

async function withRetry(fn, attempts=3){
  let lastErr;
  for(let i=0; i<attempts; i++){
    try{ return await fn(); }
    catch(e){
      lastErr = e;
      const msg = (e && e.message) || '';
      if(/rate limit/i.test(msg)) throw e; // don't hammer further on a rate limit
      if(i < attempts-1) await new Promise(r => setTimeout(r, 400 * (i+1)));
    }
  }
  throw lastErr;
}

async function sGet(key, shared){
  if(HAS_CLAUDE_STORAGE){
    try{
      const r = await withRetry(() => window.storage.get(key, shared));
      if(!r || r.value === undefined || r.value === null) return null;
      try{ return JSON.parse(r.value); } catch(parseErr){ return r.value; }
    }catch(e){ return null; }
  }
  if(shared && isRemote()){
    return (key in remoteDoc) ? remoteDoc[key] : null;
  }
  try{
    const store = shared ? localStorage : sessionStorage;
    const raw = store.getItem(key);
    if(raw === null || raw === undefined) return null;
    try{ return JSON.parse(raw); } catch(parseErr){ return raw; }
  }catch(e){ return null; }
}
async function sSet(key, value, shared){
  if(HAS_CLAUDE_STORAGE){
    try{ return await withRetry(() => window.storage.set(key, JSON.stringify(value), shared)); }
    catch(e){ console.error('storage set failed', key, e); return null; }
  }
  if(shared && isRemote()){
    remoteDoc[key] = value; remoteDirty = true;
    try{ await remoteFlush(); return true; }
    catch(e){ console.error('remote flush failed', key, e); return null; }
  }
  try{
    const store = shared ? localStorage : sessionStorage;
    store.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){ console.error('storage set failed', key, e); return null; }
}
async function sList(prefix, shared){
  if(HAS_CLAUDE_STORAGE){
    try{ const r = await withRetry(() => window.storage.list(prefix, shared)); return r ? r.keys : []; }
    catch(e){ return []; }
  }
  if(shared && isRemote()){
    return Object.keys(remoteDoc).filter(k => k.startsWith(prefix));
  }
  try{
    const store = shared ? localStorage : sessionStorage;
    const keys = [];
    for(let i=0; i<store.length; i++){
      const k = store.key(i);
      if(k && k.startsWith(prefix)) keys.push(k);
    }
    return keys;
  }catch(e){ return []; }
}
async function sDelete(key, shared){
  if(HAS_CLAUDE_STORAGE){
    try{ return await withRetry(() => window.storage.delete(key, shared)); }
    catch(e){ return null; }
  }
  if(shared && isRemote()){
    delete remoteDoc[key]; remoteDirty = true;
    try{ await remoteFlush(); return true; }
    catch(e){ console.error('remote flush failed', key, e); return null; }
  }
  try{
    const store = shared ? localStorage : sessionStorage;
    store.removeItem(key);
    return true;
  }catch(e){ return null; }
}
function suffix(key, prefix){ return key.slice(prefix.length); }

function pad2(n){ return String(n).padStart(2,'0'); }
function localDateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseLocalDateStr(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function computeDayCycle(startDateStr){
  const start = parseLocalDateStr(startDateStr);
  const today = parseLocalDateStr(localDateStr(new Date()));
  const diff = Math.round((today - start) / 86400000);
  const day = Math.max(diff + 1, 1);
  const cycle = Math.floor((day - 1) / 2) + 1;
  return {day, cycle};
}
function msUntilNextMidnight(){
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
  return next - now;
}
function formatCountdown(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
}

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const hashBuf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function genId(){ return Math.random().toString(36).slice(2,10); }

/* ---------------- identity / onboarding ---------------- */

async function loadIdentity(){
  identity = await sGet('my-identity', false);
  if(identity && identity.remote){
    remoteBlobId = identity.code.slice(2);
  }
}

async function createGroup(name, password){
  const startDate = localDateStr(new Date());
  const memberRec = {name, emoji: EMOJIS[Math.floor(Math.random()*EMOJIS.length)], xp:0, weeklyXp:0, ownedThemes:['plain'], selectedTheme:'plain'};
  if(HAS_CLAUDE_STORAGE){
    const code = genCode();
    const playerId = 'p_' + genId();
    await sSet(`dc:${code}:daystart`, startDate, true);
    if(password) await sSet(`dc:${code}:pwhash`, await sha256(password+code), true);
    await sSet(`dc:${code}:member:${playerId}`, memberRec, true);
    identity = {code, playerId, playerName:name, joinedDay:1, remote:false};
    await sSet('my-identity', identity, false);
    await boot();
    return;
  }
  if(hasAppsScript()){
    try{
      const code = genCode();
      remoteBlobId = code;
      const playerId = 'p_' + genId();
      const pwProof = password ? await sha256(password+code) : '';
      remoteDoc = {};
      remoteDoc[`dc:${code}:daystart`] = startDate;
      remoteDoc[`dc:${code}:member:${playerId}`] = memberRec;
      remoteDirty = true;
      identity = {code:'G-'+code, playerId, playerName:name, joinedDay:1, remote:true, backend:'appsscript', pwProof};
      await remoteFlush();
      await sSet('my-identity', identity, false);
      await boot();
      return;
    }catch(e){
      console.error('apps script group creation failed, falling back', e);
    }
  }
  // try the free remote backend so friends on other PCs can join without any account
  try{
    const blobId = await remoteCreate();
    remoteBlobId = blobId;
    const playerId = 'p_' + genId();
    remoteDoc = {};
    remoteDoc[`dc:${blobId}:daystart`] = startDate;
    if(password) remoteDoc[`dc:${blobId}:pwhash`] = await sha256(password+blobId);
    remoteDoc[`dc:${blobId}:member:${playerId}`] = memberRec;
    remoteDirty = true;
    identity = {code: 'R-'+blobId, playerId, playerName:name, joinedDay:1, remote:true};
    await remoteFlush();
    await sSet('my-identity', identity, false);
    await boot();
  }catch(e){
    console.error('remote group creation failed, falling back to local-only', e);
    const code = genCode();
    const playerId = 'p_' + genId();
    identity = {code, playerId, playerName:name, joinedDay:1, remote:false};
    await sSet(`dc:${code}:daystart`, startDate, true);
    if(password) await sSet(`dc:${code}:pwhash`, await sha256(password+code), true);
    await sSet(`dc:${code}:member:${playerId}`, memberRec, true);
    await sSet('my-identity', identity, false);
    await boot();
    showToast('Cloud-Speicher nicht erreichbar — Gruppe funktioniert nur auf diesem PC');
  }
}

async function joinGroup(codeRaw, name, password){
  const raw = codeRaw.replace(/\s+/g, '');
  const memberRec = {name, emoji: EMOJIS[Math.floor(Math.random()*EMOJIS.length)], xp:0, weeklyXp:0, ownedThemes:['plain'], selectedTheme:'plain'};
  if(raw.toUpperCase().startsWith('G-')){
    const code = raw.slice(2);
    try{
      const pwProof = password ? await sha256(password+code) : '';
      const check = await appsScriptCheckPassword(code, pwProof);
      if(check.hasPassword && !check.valid){
        showToast(password ? 'Falsches Passwort' : 'Diese Gruppe ist passwortgeschützt');
        return false;
      }
      remoteBlobId = code;
      identity = {code:'G-'+code, playerId:null, playerName:name, remote:true, backend:'appsscript', pwProof};
      await remoteFetch();
      const playerId = 'p_' + genId();
      const startDate = remoteDoc[`dc:${code}:daystart`] || localDateStr(new Date());
      remoteDoc[`dc:${code}:member:${playerId}`] = memberRec;
      remoteDirty = true;
      identity = {code:'G-'+code, playerId, playerName:name, joinedDay: computeDayCycle(startDate).day, remote:true, backend:'appsscript', pwProof};
      await remoteFlush();
      await sSet('my-identity', identity, false);
      await boot();
      return true;
    }catch(e){
      identity = null;
      showToast('Gruppencode nicht gefunden oder Backend nicht erreichbar');
      return false;
    }
  }
  if(raw.toUpperCase().startsWith('R-')){
    const blobId = raw.slice(2);
    try{
      remoteBlobId = blobId;
      await remoteFetch();
      const storedHash = remoteDoc[`dc:${blobId}:pwhash`];
      if(storedHash){
        if(!password){ showToast('Diese Gruppe ist passwortgeschützt'); return false; }
        if(await sha256(password+blobId) !== storedHash){ showToast('Falsches Passwort'); return false; }
      }
      const playerId = 'p_' + genId();
      const startDate = remoteDoc[`dc:${blobId}:daystart`] || localDateStr(new Date());
      remoteDoc[`dc:${blobId}:member:${playerId}`] = memberRec;
      remoteDirty = true;
      identity = {code: 'R-'+blobId, playerId, playerName:name, joinedDay: computeDayCycle(startDate).day, remote:true};
      await remoteFlush();
      await sSet('my-identity', identity, false);
      await boot();
      return true;
    }catch(e){
      showToast('Gruppencode nicht gefunden oder Cloud-Speicher nicht erreichbar');
      return false;
    }
  }
  const code = raw.toUpperCase();
  let startDate = null;
  for(let attempt = 0; attempt < 4 && !startDate; attempt++){
    if(attempt > 0) await new Promise(r => setTimeout(r, 900));
    startDate = await sGet(`dc:${code}:daystart`, true);
  }
  if(!startDate){ showToast('Gruppencode nicht gefunden — bitte genau prüfen'); return false; }
  const storedHash = await sGet(`dc:${code}:pwhash`, true);
  if(storedHash){
    if(!password){ showToast('Diese Gruppe ist passwortgeschützt'); return false; }
    if(await sha256(password+code) !== storedHash){ showToast('Falsches Passwort'); return false; }
  }
  const playerId = 'p_' + genId();
  await sSet(`dc:${code}:member:${playerId}`, memberRec, true);
  identity = {code, playerId, playerName:name, joinedDay: computeDayCycle(startDate).day, remote:false};
  await sSet('my-identity', identity, false);
  await boot();
  return true;
}

async function leaveGroup(){
  if(identity){
    const storageCode = identity.remote ? identity.code.slice(2) : identity.code;
    await sDelete(`dc:${storageCode}:member:${identity.playerId}`, true);
  }
  await sSet('my-identity', null, false);
  identity = null; S = null; remoteBlobId = null; remoteDoc = {};
  renderOnboarding();
}

/* ---------------- core state load ---------------- */

async function processWeeklyTitles(code, day, players){
  const weekNum = Math.floor((day - 1) / 7) + 1;
  const processedKey = `dc:${code}:weekprocessed`;
  const processed = (await sGet(processedKey, true)) || 0;
  if(weekNum - 1 <= processed) return; // nothing new to close out
  if(players.length < 2) { await sSet(processedKey, weekNum - 1, true); return; }

  const withXp = players.filter(p => p.weeklyXp > 0);
  if(withXp.length >= 2){
    const sorted = [...withXp].sort((a,b) => b.weeklyXp - a.weeklyXp);
    const best = sorted[0], worst = sorted[sorted.length - 1];
    if(best.id !== worst.id){
      await sSet(`dc:${code}:title:${best.id}`, {label:'👑 Champion der Woche', emoji:'👑'}, true);
      await sSet(`dc:${code}:title:${worst.id}`, {label:'🐌 Schlusslicht', emoji:'🐌'}, true);
      await sSet(`dc:${code}:punishment:${weekNum}`, {targetId: worst.id}, true);
      for(const p of players){
        if(p.id !== best.id && p.id !== worst.id){
          await sDelete(`dc:${code}:title:${p.id}`, true);
        }
      }
      await pushLogRaw(code, day, `Wochenauswertung: ${best.emoji} <b>${esc(best.name)}</b> war Champion der Woche, ${worst.emoji} <b>${esc(worst.name)}</b> Schlusslicht — die Gruppe stimmt jetzt über eine Strafe fürs echte Leben ab.`);
    }
  }
  for(const p of players){
    await sSet(`dc:${code}:member:${p.id}`, memberPayload(p, {weeklyXp:0}), true);
  }
  await sSet(processedKey, weekNum - 1, true);
}

async function loadState(){
  const displayCode = identity.code, me = identity.playerId;
  if(isRemote()){
    try{ await remoteFetch(); }
    catch(e){ console.error('remote fetch failed', e); showToast('Cloud-Speicher gerade nicht erreichbar'); return; }
  }
  const code = isRemote() ? remoteBlobId : displayCode;
  const startDate = (await sGet(`dc:${code}:daystart`, true)) || localDateStr(new Date());
  const {day, cycle} = computeDayCycle(startDate);

  const lastSeenKey = `dc:${code}:lastseenday`;
  const lastSeen = await sGet(lastSeenKey, false);
  if(lastSeen !== day){
    if(lastSeen !== null && day > lastSeen){
      await pushLogRaw(code, day, `— Tag ${day} beginnt${cycle !== Math.floor((lastSeen-1)/2)+1 ? ` (neuer Zyklus ${cycle}, Erstell-Slots erneuert)` : ''} —`);
    }
    await sSet(lastSeenKey, day, false);
  }

  const memberKeys = await sList(`dc:${code}:member:`, true);
  const memberVals = await Promise.all(memberKeys.map(k => sGet(k, true)));
  const players = memberKeys.map((k,i) => memberVals[i] ? {id: suffix(k, `dc:${code}:member:`), ...memberVals[i]} : null).filter(Boolean);

  await processWeeklyTitles(code, day, players);

  const titleKeys = await sList(`dc:${code}:title:`, true);
  const titleVals = await Promise.all(titleKeys.map(k => sGet(k, true)));
  const titles = {};
  titleKeys.forEach((k,i) => { if(titleVals[i]) titles[suffix(k, `dc:${code}:title:`)] = titleVals[i]; });
  players.forEach(p => { p.title = titles[p.id] || null; });

  const weekNum = Math.floor((day - 1) / 7) + 1;
  const punishInfo = await sGet(`dc:${code}:punishment:${weekNum}`, true);
  let punishment = null;
  if(punishInfo){
    const propKeys = await sList(`dc:${code}:punishprop:${weekNum}:`, true);
    const propVals = await Promise.all(propKeys.map(k => sGet(k, true)));
    const proposals = propKeys.map((k,i) => propVals[i] ? {id: suffix(k, `dc:${code}:punishprop:${weekNum}:`), ...propVals[i]} : null).filter(Boolean);
    const votes = {};
    for(const p of proposals){
      const voteKeys = await sList(`dc:${code}:punishvote:${weekNum}:${p.id}:`, true);
      votes[p.id] = voteKeys.map(k => suffix(k, `dc:${code}:punishvote:${weekNum}:${p.id}:`));
    }
    punishment = {weekNum, targetId: punishInfo.targetId, proposals, votes};
  }

  const poolKeys = await sList(`dc:${code}:pool:`, true);
  const poolVals = await Promise.all(poolKeys.map(k => sGet(k, true)));
  const pool = poolKeys.map((k,i) => poolVals[i] ? {id: suffix(k, `dc:${code}:pool:`), ...poolVals[i]} : null).filter(Boolean);

  const reviewKeys = await sList(`dc:${code}:review:`, true);
  const reviewVals = await Promise.all(reviewKeys.map(k => sGet(k, true)));
  const reviews = reviewKeys.map((k,i) => reviewVals[i] ? {id: suffix(k, `dc:${code}:review:`), ...reviewVals[i]} : null).filter(Boolean);

  const todayAssignKeys = await sList(`dc:${code}:assign:${day}:`, true);
  const todayAssignVals = await Promise.all(todayAssignKeys.map(k => sGet(k, true)));
  const todayAssignments = {};
  todayAssignKeys.forEach((k,i) => { if(todayAssignVals[i]) todayAssignments[suffix(k, `dc:${code}:assign:${day}:`)] = todayAssignVals[i]; });

  await Promise.all(Object.entries(todayAssignments).map(async ([pid, a]) => {
    if(a.status !== 'voting') return;
    const voteKeys = await sList(`dc:${code}:vote:${day}:${pid}:`, true);
    const voteVals = await Promise.all(voteKeys.map(k => sGet(k, true)));
    const votes = {};
    voteKeys.forEach((k,i) => { votes[suffix(k, `dc:${code}:vote:${day}:${pid}:`)] = voteVals[i]; });
    a.votes = votes;
  }));

  const logKeys = (await sList(`dc:${code}:log:`, true)).sort().reverse().slice(0,12);
  const logVals = await Promise.all(logKeys.map(async k => {
    const v = await sGet(k, true);
    if(!v) return null;
    const id = suffix(k, `dc:${code}:log:`);
    const reactionKeys = await sList(`dc:${code}:reaction:${id}:`, true);
    const reactions = {};
    for(const rk of reactionKeys){
      const rv = await sGet(rk, true);
      if(rv) reactions[suffix(rk, `dc:${code}:reaction:${id}:`)] = rv;
    }
    return {...v, id, reactions};
  }));
  const log = logVals.filter(Boolean);

  S = {code, displayCode, day, cycle, players, pool, reviews, todayAssignments, log, punishment};

  await ensureMyAssignment();
  await processMissedPenalties();
  await checkAndFinalizeMyVotes();
  await checkMyDuels();
}

async function pushLog(text, type){
  await pushLogRaw(S.code, S.day, text, type);
}
async function pushLogRaw(code, day, text, type){
  const key = `dc:${code}:log:${Date.now()}-${genId()}`;
  await sSet(key, {day, text, type: type || 'system'}, true);
}

function getMe(){ return S.players.find(p => p.id === identity.playerId); }
function otherPlayers(){ return S.players.filter(p => p.id !== identity.playerId); }

/* ---------------- task selection ---------------- */

function pickTaskForMe(lastTask){
  const fresh = S.pool.filter(t => t.status === 'active' && t.cycle === S.cycle);
  let candidates = fresh;
  if(lastTask){
    candidates = fresh.filter(t => t.id !== lastTask.poolTaskId && t.category !== lastTask.category);
    if(candidates.length === 0) candidates = fresh.filter(t => t.id !== lastTask.poolTaskId);
    if(candidates.length === 0) candidates = fresh;
  }
  if(candidates.length > 0){
    const t = candidates[Math.floor(Math.random()*candidates.length)];
    return {source:'pool', poolTaskId:t.id, title:t.title, desc:t.desc, category:t.category, proofType:t.proofType, difficulty:t.difficulty, points:t.points, creatorName: t.creatorName || 'Unbekannt'};
  }
  const stale = S.pool.filter(t => t.status === 'active' && t.cycle < S.cycle).sort((a,b) => a.cycle - b.cycle);
  if(stale.length > 0){
    const t = stale[0];
    return {source:'fallback', poolTaskId:t.id, title:t.title, desc:t.desc, category:t.category, proofType:t.proofType, difficulty:t.difficulty, points:t.points, creatorName: t.creatorName || 'Unbekannt'};
  }
  const base = PREDEFINED[Math.floor(Math.random()*PREDEFINED.length)];
  return {source:'predefined', poolTaskId:null, title:base.title, desc:base.desc, category:base.category, proofType:base.proofType, difficulty:base.difficulty, points: DIFF[base.difficulty].points, creatorName:'System'};
}

async function ensureMyAssignment(){
  const me = identity.playerId;
  if(S.todayAssignments[me]) return; // already have one

  const prevDayKey = `dc:${S.code}:assign:${S.day - 1}:${me}`;
  const prevAssignment = S.day > 1 ? await sGet(prevDayKey, true) : null;
  const prev = prevAssignment ? prevAssignment.task : null;

  const picked = pickTaskForMe(prev);
  const assignment = {task: picked, status:'active', proof:'', result:null};
  await sSet(`dc:${S.code}:assign:${S.day}:${me}`, assignment, true);

  if(picked.poolTaskId){
    await sSet(`dc:${S.code}:pool:${picked.poolTaskId}`, {...S.pool.find(t=>t.id===picked.poolTaskId), status:'assigned'}, true);
  }
  S.todayAssignments[me] = assignment;
}

/* ---------------- missed penalty (self-applied) ---------------- */

async function processMissedPenalties(){
  const me = identity.playerId;
  const trackerKey = `dc:${S.code}:mytracker`;
  const defaultCheckedUpTo = Math.max((identity.joinedDay || 1) - 1, 0);
  const tracker = (await sGet(trackerKey, false)) || {checkedUpTo: defaultCheckedUpTo};
  let from = Math.max(tracker.checkedUpTo + 1, 1);
  const to = S.day - 1;
  if(from > to){ return; }
  let penalty = 0; let missedCount = 0; let protectedCount = 0;
  for(let d = from; d <= to && d <= from + 60; d++){
    const key = `dc:${S.code}:assign:${d}:${me}`;
    const a = await sGet(key, true);
    const shielded = !!(await sGet(`dc:${S.code}:shield:${d}:${me}`, true));
    if(a && a.status === 'active'){
      if(shielded){
        await sSet(key, {...a, status:'resolved', result:'protected'}, true);
        protectedCount++;
      } else {
        // had a task that day, never even submitted it
        await sSet(key, {...a, status:'resolved', result:'missed'}, true);
        penalty += MISS_PENALTY; missedCount++;
      }
    } else if(!a){
      // never opened the app that day, so no task was ever picked up —
      // still counts as a missed day, same as everyone else
      await sSet(key, {
        task:{title:'(keine Aufgabe abgeholt)', desc:'', category:'—', proofType:'none', difficulty:null, points:0},
        status:'resolved', result: shielded ? 'protected' : 'missed'
      }, true);
      if(shielded) protectedCount++; else { penalty += MISS_PENALTY; missedCount++; }
    }
    // status 'voting' or 'resolved' already handled — leave untouched
  }
  if(missedCount > 0){
    const meRec = getMe();
    await sSet(`dc:${S.code}:member:${me}`, memberPayload(meRec, {xp: meRec.xp + penalty, weeklyXp: meRec.weeklyXp + penalty, streak: 0}), true);
    meRec.xp += penalty; meRec.weeklyXp += penalty; meRec.streak = 0;
    await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat ${missedCount} Aufgabe(n) nicht versucht. ${penalty} XP.`);
  }
  await sSet(trackerKey, {checkedUpTo: to}, false);
}

/* ---------------- creation ---------------- */

async function createTask(data){
  const me = identity.playerId;
  const meRec = getMe();
  const others = otherPlayers();
  if(others.length === 0){ showToast('Lade zuerst Freunde in die Gruppe ein'); return; }
  const reviewer = others[Math.floor(Math.random()*others.length)];
  const id = genId();
  const review = {
    task: {title:data.title, desc:data.desc, category:data.category, proofType:data.proofType},
    creatorId: me, creatorName: meRec.name, reviewerId: reviewer.id,
    status:'pending', creationCycle: S.cycle
  };
  await sSet(`dc:${S.code}:review:${id}`, review, true);
  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat eine neue Aufgabe zur Prüfung eingereicht.`);
}

async function resolveReview(reviewId, accepted, difficulty, reason){
  const rv = S.reviews.find(r => r.id === reviewId);
  if(!rv) return;
  const creator = S.players.find(p => p.id === rv.creatorId);
  if(accepted){
    const poolId = genId();
    await sSet(`dc:${S.code}:pool:${poolId}`, {
      title: rv.task.title, desc: rv.task.desc, category: rv.task.category, proofType: rv.task.proofType,
      difficulty, points: DIFF[difficulty].points, status:'active', cycle: S.cycle,
      creatorName: creator ? creator.name : 'Unbekannt'
    }, true);
    await sSet(`dc:${S.code}:review:${reviewId}`, {...rv, status:'accepted', difficulty}, true);
    await pushLog(`Eine Aufgabe von <b>${creator ? esc(creator.name) : '?'}</b> wurde angenommen (${DIFF[difficulty].label}) und kam in den Pool.`);
  } else {
    await sSet(`dc:${S.code}:review:${reviewId}`, {...rv, status:'rejected', reason}, true);
    await pushLog(`Eine Aufgabe von <b>${creator ? esc(creator.name) : '?'}</b> wurde abgelehnt (${esc(reason)}).`);
  }
}

/* ---------------- completion & voting ---------------- */

async function submitProof(proofText){
  const me = identity.playerId;
  const a = S.todayAssignments[me];
  if(!a || a.status !== 'active') return;
  const updated = {...a, proof: proofText || '', status:'voting'};
  await sSet(`dc:${S.code}:assign:${S.day}:${me}`, updated, true);
  S.todayAssignments[me] = updated;
  const meRec = getMe();
  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat „${esc(a.task.title)}" eingereicht. Die Gruppe stimmt jetzt ab.`);
}

async function castVote(assigneeId, vote){
  const me = identity.playerId;
  await sSet(`dc:${S.code}:vote:${S.day}:${assigneeId}:${me}`, vote, true);
  const meRec = getMe();
  const target = S.players.find(p => p.id === assigneeId);
  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat bei ${target ? esc(target.name) : '?'}s Aufgabe mit ${vote==='yes' ? '✅ Ja' : '❌ Nein'} abgestimmt.`);
  showToast(vote === 'yes' ? 'Mit Ja gestimmt' : 'Mit Nein gestimmt');
}

async function checkAndFinalizeMyVotes(){
  const me = identity.playerId;
  const myAssign = S.todayAssignments[me];
  if(!myAssign || myAssign.status !== 'voting') return;
  const votes = myAssign.votes || {};
  const needed = otherPlayers().length;
  const collected = Object.keys(votes).length;
  if(needed > 0 && collected >= needed){
    const yes = Object.values(votes).filter(v=>v==='yes').length;
    const no = Object.values(votes).filter(v=>v==='no').length;
    const passed = yes > no;
    const result = passed ? 'completed' : 'failed';
    const finalAssign = {...myAssign, status:'resolved', result};
    await sSet(`dc:${S.code}:assign:${S.day}:${me}`, finalAssign, true);
    S.todayAssignments[me] = finalAssign;
    const meRec = getMe();
    const gained = passed ? myAssign.task.points : 0;
    const newStreak = passed ? (meRec.streak||0) + 1 : 0;
    const newBest = Math.max(meRec.bestStreak||0, newStreak);
    await sSet(`dc:${S.code}:member:${me}`, memberPayload(meRec, {xp: meRec.xp + gained, weeklyXp: meRec.weeklyXp + gained, streak:newStreak, bestStreak:newBest}), true);
    meRec.xp += gained; meRec.weeklyXp += gained; meRec.streak = newStreak; meRec.bestStreak = newBest;
    await pushLog(passed
      ? `${meRec.emoji} <b>${esc(meRec.name)}</b>s Aufgabe wurde bestätigt (${yes} Ja / ${no} Nein). +${gained} XP.${newStreak>1 ? ` 🔥 ${newStreak} Tage in Folge.` : ''}`
      : `${meRec.emoji} <b>${esc(meRec.name)}</b>s Aufgabe wurde abgelehnt (${yes} Ja / ${no} Nein). 0 XP.`);
    await checkMyDuels();
  }
}

function pendingVotesForMe(){
  const me = identity.playerId;
  const out = [];
  for(const [pid, a] of Object.entries(S.todayAssignments)){
    if(pid === me) continue;
    if(a.status === 'voting'){

    }
  }
  return out;
}

function esc(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function challengeDuel(opponentId){
  if(!S) return;
  const day = S.day;
  const keys = await sList(`dc:${S.code}:duel:`, true);
  for(const k of keys){
    const v = await sGet(k, true);
    if(v && v.day === day && ((v.a===identity.playerId && v.b===opponentId) || (v.a===opponentId && v.b===identity.playerId))){
      showToast('Ihr habt heute schon ein Duell');
      return;
    }
  }
  const id = genId();
  await sSet(`dc:${S.code}:duel:${id}`, {a:identity.playerId, b:opponentId, day, status:'active', winner:null}, true);
  const opp = S.players.find(p=>p.id===opponentId);
  await pushLog(`⚔️ Duell gestartet zwischen dir und ${opp?esc(opp.name):'?'} für heute — Belohnung geht an, wer die Aufgabe schafft und der andere nicht.`);
  showToast('Duell gestartet ⚔️');
}

async function checkMyDuels(){
  if(!S) return;
  const DUEL_BONUS = 15;
  const keys = await sList(`dc:${S.code}:duel:`, true);
  for(const k of keys){
    const v = await sGet(k, true);
    if(!v || v.status !== 'active') continue;
    if(v.a !== identity.playerId && v.b !== identity.playerId) continue;
    const otherId = v.a === identity.playerId ? v.b : v.a;
    const myAssign = await sGet(`dc:${S.code}:assign:${v.day}:${identity.playerId}`, true);
    const otherAssign = await sGet(`dc:${S.code}:assign:${v.day}:${otherId}`, true);
    if(!myAssign || !otherAssign) continue;
    if(myAssign.status !== 'resolved' || otherAssign.status !== 'resolved') continue;
    const myWon = myAssign.result === 'completed' && otherAssign.result !== 'completed';
    const otherWon = otherAssign.result === 'completed' && myAssign.result !== 'completed';
    if(myWon){
      const meRec = getMe();
      await sSet(`dc:${S.code}:member:${identity.playerId}`, memberPayload(meRec, {xp: meRec.xp+DUEL_BONUS, weeklyXp: meRec.weeklyXp+DUEL_BONUS}), true);
      meRec.xp += DUEL_BONUS; meRec.weeklyXp += DUEL_BONUS;
      await sSet(k, {...v, status:'resolved', winner:identity.playerId}, true);
      await pushLog(`⚔️ ${meRec.emoji} <b>${esc(meRec.name)}</b> hat ein Duell gewonnen! +${DUEL_BONUS} Bonus-XP.`);
    } else if(otherWon){
      await sSet(k, {...v, status:'resolved', winner:otherId}, true);
    } else {
      await sSet(k, {...v, status:'resolved', winner:null}, true);
    }
  }
}

const LEVELS = [
  {min:0, title:'Neuling'}, {min:50, title:'Anfänger'}, {min:150, title:'Einsteiger'},
  {min:300, title:'Mitläufer'}, {min:500, title:'Geübt'}, {min:800, title:'Fortgeschritten'},
  {min:1200, title:'Profi'}, {min:1800, title:'Experte'}, {min:2500, title:'Meister'}, {min:3500, title:'Legende'}
];
function levelFor(xp){
  let lvl = 1, title = LEVELS[0].title;
  for(let i=0;i<LEVELS.length;i++){ if(xp >= LEVELS[i].min){ lvl = i+1; title = LEVELS[i].title; } }
  return {level:lvl, title};
}

function memberPayload(rec, changes){
  return {
    name: rec.name, emoji: rec.emoji,
    xp: rec.xp, weeklyXp: rec.weeklyXp,
    ownedThemes: rec.ownedThemes || ['plain'],
    selectedTheme: rec.selectedTheme || 'plain',
    streak: rec.streak || 0,
    bestStreak: rec.bestStreak || 0,
    ...changes
  };
}

function applyTheme(themeId){
  const theme = THEMES.find(t => t.id === themeId) || THEMES[0];
  Object.entries(theme.tokens).forEach(([k,v]) => {
    document.documentElement.style.setProperty('--'+k, v);
  });
}

function myThemeState(meRec){
  return {
    owned: (meRec && meRec.ownedThemes) || ['plain'],
    selected: (meRec && meRec.selectedTheme) || 'plain'
  };
}

function renderThemeList(me){
  const owned = me.ownedThemes || ['plain'];
  const selected = me.selectedTheme || 'plain';
  return THEMES.map(t => {
    const isOwned = owned.includes(t.id);
    const isSelected = selected === t.id;
    let action;
    if(isSelected) action = `<span class="hint" style="margin:0; font-weight:700; color:var(--accent);">Aktiv ✓</span>`;

      const label = t.currency === 'eur' ? `${t.cost.toFixed(2)} € (Demo)` : `${t.cost} XP`;

async function buyTheme(themeId){
  const theme = THEMES.find(t => t.id === themeId);
  const meRec = getMe();
  if(!theme || !meRec) return;
  const owned = meRec.ownedThemes || ['plain'];
  if(owned.includes(themeId)) return;

  let newXp = meRec.xp, newWeekly = meRec.weeklyXp;
  if(theme.currency === 'xp'){
    if(meRec.xp < theme.cost) return;
    newXp -= theme.cost; newWeekly -= theme.cost;
  }
  // currency 'eur' themes are demo-only — no real payment is processed, unlocked directly for testing

  const newOwned = [...owned, themeId];
  await sSet(`dc:${S.code}:member:${identity.playerId}`, memberPayload(meRec, {xp:newXp, weeklyXp:newWeekly, ownedThemes:newOwned, selectedTheme:themeId}), true);
  meRec.xp = newXp; meRec.weeklyXp = newWeekly; meRec.ownedThemes = newOwned; meRec.selectedTheme = themeId;
  applyTheme(themeId);
  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat das Design „${theme.name}" freigeschaltet${theme.demo ? ' (Demo — keine echte Zahlung)' : ''}.`);
  showToast(`🎨 ${theme.name} freigeschaltet`);
}

async function selectTheme(themeId){
  const meRec = getMe();
  if(!meRec) return;
  const owned = meRec.ownedThemes || ['plain'];
  if(!owned.includes(themeId)) return;
  await sSet(`dc:${S.code}:member:${identity.playerId}`, memberPayload(meRec, {selectedTheme:themeId}), true);
  meRec.selectedTheme = themeId;
  applyTheme(themeId);
}

async function buyPerk(perkId){
  const perk = PERKS.find(p => p.id === perkId);
  const meRec = getMe();
  if(!perk || meRec.xp < perk.cost) return;
  const me = identity.playerId;
  const a = S.todayAssignments[me];

  if(perkId === 'shield'){
    await sSet(`dc:${S.code}:shield:${S.day}:${me}`, true, true);
  } else if(perkId === 'reroll'){
    if(!a || a.status !== 'active') return;
    if(a.task.poolTaskId){
      const old = S.pool.find(t => t.id === a.task.poolTaskId);
      if(old) await sSet(`dc:${S.code}:pool:${a.task.poolTaskId}`, {...old, status:'active'}, true);
    }
    const picked = pickTaskForMe(null);
    const updated = {...a, task: picked};
    await sSet(`dc:${S.code}:assign:${S.day}:${me}`, updated, true);
    if(picked.poolTaskId){
      const t = S.pool.find(x => x.id === picked.poolTaskId);
      if(t) await sSet(`dc:${S.code}:pool:${picked.poolTaskId}`, {...t, status:'assigned'}, true);
    }
  } else if(perkId === 'discount'){
    if(!a || a.status !== 'active') return;
    const order = ['hard','normal','easy'];
    const idx = order.indexOf(a.task.difficulty);
    if(idx === -1 || idx === order.length - 1) return;
    const newDiff = order[idx+1];
    const updated = {...a, task: {...a.task, difficulty:newDiff, points: DIFF[newDiff].points}};
    await sSet(`dc:${S.code}:assign:${S.day}:${me}`, updated, true);
  } else if(perkId === 'joker'){
    if(!a || a.status !== 'active') return;
    const updated = {...a, status:'resolved', result:'excused'};
    await sSet(`dc:${S.code}:assign:${S.day}:${me}`, updated, true);
  }

  const updatedXp = meRec.xp - perk.cost, updatedWeekly = meRec.weeklyXp - perk.cost;
  await sSet(`dc:${S.code}:member:${me}`, memberPayload(meRec, {xp:updatedXp, weeklyXp:updatedWeekly}), true);
  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat „${perk.icon} ${perk.label}" für ${perk.cost} XP gekauft.`);
  showToast(`${perk.icon} ${perk.label} aktiviert`);
}

      const no = Object.values(votes).filter(v=>v==='no').length;
      const total = otherPlayers().length;

        <div class="vote-track"><div class="vote-yes" style="width:${yesPct}%"></div><div class="vote-no" style="width:${100-yesPct}%"></div></div>
        <div class="vote-avatars">${avatars}</div>

      </div>`;
    } else if(a.status === 'resolved'){

        </div>
        <div class="perf"></div>
        <div class="ticket-bottom">${bottom}</div>
      </div>`;
  }

  const REACTION_EMOJIS = ['🔥','👏','😂','💪'];
  const logHtml = S.log.length === 0
    ? `<div class="empty-state"><span class="ic">📭</span>Noch nichts passiert.</div>`
    : S.log.map(l => {
        const reactions = l.reactions || {};
        const counts = {};
        Object.values(reactions).forEach(em => { counts[em] = (counts[em]||0) + 1; });
        const myReaction = reactions[identity.playerId];
        const existingPills = Object.entries(counts).map(([em,c]) =>
          `<button class="chip ${myReaction===em?'selected':''}" data-react="${l.id}" data-emoji="${em}" style="padding:3px 9px; font-size:11px;">${em} ${c}</button>`
        ).join('');
        const addPicker = !myReaction ? REACTION_EMOJIS.map(em =>
          `<button class="chip" data-react="${l.id}" data-emoji="${em}" style="padding:3px 8px; font-size:11px; opacity:0.5;">${em}</button>`
        ).join('') : '';
        const isChat = l.type === 'chat';
        const bodyHtml = isChat
          ? `<div class="chat-bubble"><span class="day-tag">T${l.day}</span><span>${l.text}</span></div>`
          : `<div style="display:flex; gap:10px;"><span class="day-tag">T${l.day}</span><span>${l.text}</span></div>`;
        return `<div class="log-item ${isChat?'chat':''}" style="flex-direction:column; align-items:flex-start;">
          ${bodyHtml}
          <div class="chip-row" style="margin-top:5px; margin-left:${isChat?'0':'34px'};">${existingPills}${addPicker}</div>
        </div>`;
      }).join('');

  area.innerHTML = `
    <div class="section-title">Heutige Aufgabe<div class="rule"></div></div>

    <div class="section-title">Chat<div class="rule"></div></div>

  if(cb) cb.onclick = openProofModal;

  area.querySelectorAll('[data-react]').forEach(btn => btn.onclick = async () => {
    await toggleReaction(btn.dataset.react, btn.dataset.emoji);
    renderDashboard();
  });
}

async function sendChatMessage(text){

  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b>: ${esc(text)}`, 'chat');

async function toggleReaction(logId, emoji){
  const key = `dc:${S.code}:reaction:${logId}:${identity.playerId}`;
  const entry = S.log.find(l => l.id === logId);
  if(!entry) return;
  entry.reactions = entry.reactions || {};
  if(entry.reactions[identity.playerId] === emoji){
    await sDelete(key, true);
    delete entry.reactions[identity.playerId];
  } else {
    await sSet(key, emoji, true);
    entry.reactions[identity.playerId] = emoji;
  }
}

function resizeImageFile(file, maxW){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function voteForPunishment(proposalId){
  if(!S.punishment) return;
  const week = S.punishment.weekNum;
  // remove any previous vote by me on another proposal this week

      await sDelete(`dc:${S.code}:punishvote:${week}:${p.id}:${identity.playerId}`, true);
    }
  }
  await sSet(`dc:${S.code}:punishvote:${week}:${proposalId}:${identity.playerId}`, true, true);
}

      <label>Kategorie</label>
      <div class="chip-row" id="ctCatRow">${CATS.map(c=>`<div class="chip" data-cat="${c}">${c}</div>`).join('')}</div>
      <label>Nachweis-Typ</label>
      <div class="chip-row" id="ctProofRow">${PROOF_TYPES.map(p=>`<div class="chip" data-proof="${p[0]}">${p[1]}</div>`).join('')}</div>
      <div class="creator-note" style="margin-top:14px;">Schwierigkeit &amp; Punkte legt anonym ein anderes Mitglied beim Prüfen fest.</div>
      <button class="btn btn-accent" id="ctSubmit">Zur anonymen Prüfung einreichen</button>
    </div>`;
  let selCat=null, selProof=null;
  formArea.querySelector('#ctTitle').oninput = () => { createFormDirty = true; };
  formArea.querySelector('#ctDesc').oninput = () => { createFormDirty = true; };
  formArea.querySelectorAll('#ctCatRow .chip').forEach(c => c.onclick = () => {
    createFormDirty = true;
    formArea.querySelectorAll('#ctCatRow .chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selCat = c.dataset.cat;
  });
  formArea.querySelectorAll('#ctProofRow .chip').forEach(c => c.onclick = () => {
    createFormDirty = true;
    formArea.querySelectorAll('#ctProofRow .chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selProof = c.dataset.proof;
  });
  formArea.querySelector('#ctSubmit').onclick = async () => {
    const title = formArea.querySelector('#ctTitle').value.trim();
    if(!title){ showToast('Bitte einen Titel eingeben'); return; }
    if(!selCat){ showToast('Bitte eine Kategorie wählen'); return; }
    if(!selProof){ showToast('Bitte einen Nachweis-Typ wählen'); return; }
    const desc = formArea.querySelector('#ctDesc').value.trim();
    formArea.querySelector('#ctSubmit').disabled = true;
    await createTask({title, desc, category:selCat, proofType:selProof});
    createFormDirty = false;
    await loadState(); render();
    showToast('Eingereicht — wartet auf anonyme Prüfung');
  };
}

function renderReview(){
  const area = document.getElementById('panel-review');
  const mine = myPendingReviews();
  const badge = document.getElementById('badgeReview');
  if(mine.length){ badge.style.display='inline-block'; badge.textContent = mine.length; } else { badge.style.display='none'; }

  area.innerHTML = `<div class="section-title">Zu prüfen<div class="rule"></div></div><div id="reviewList"></div>`;
  const list = document.getElementById('reviewList');
  if(mine.length === 0){
    list.innerHTML = `<div class="empty-state"><span class="ic">🕶️</span>Aktuell nichts zu prüfen. Du siehst nie, wer die Aufgabe erstellt hat.</div>`;
    return;
  }
  list.innerHTML = mine.map(e => `
    <div class="review-card" id="rev-${e.id}">
      <div class="cat">${esc(e.task.category)} · Nachweis: ${proofLabel(e.task.proofType)}</div>
      <h4>${esc(e.task.title)}</h4>
      ${e.task.desc ? `<p>${esc(e.task.desc)}</p>` : ''}
      <div class="diff-picker">
        <div class="diff-btn easy" data-d="easy">Einfach<b>10</b></div>
        <div class="diff-btn normal" data-d="normal">Normal<b>25</b></div>
        <div class="diff-btn hard" data-d="hard">Schwer<b>50</b></div>
      </div>
      <button class="btn btn-teal" data-accept style="margin-bottom:8px;">Annehmen mit gewählter Schwierigkeit</button>
      <select class="reason-select" id="reason-${e.id}">
        <option value="">Ablehnungsgrund wählen…</option>
        <option>Zu schwierig</option><option>Zu einfach</option><option>Zu langweilig</option>
        <option>Nicht machbar</option><option>Unfair</option><option>Unangemessen</option>
        <option>Bereits vorhanden</option><option>Sonstiges</option>
      </select>
      <button class="btn btn-danger" data-reject>Ablehnen</button>
    </div>`).join('');

  mine.forEach(e => {
    const card = document.getElementById('rev-'+e.id);
    let picked = null;
    card.querySelectorAll('.diff-btn').forEach(b => b.onclick = () => {
      reviewFormDirty = true;
      card.querySelectorAll('.diff-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected'); picked = b.dataset.d;
    });
    card.querySelector('#reason-'+e.id).onchange = () => { reviewFormDirty = true; };
    card.querySelector('[data-accept]').onclick = async () => {
      if(!picked){ showToast('Bitte zuerst eine Schwierigkeit wählen'); return; }
      await resolveReview(e.id, true, picked, null);
      reviewFormDirty = false;
      await loadState(); render();
      showToast('Aufgabe angenommen ✅');
    };
    card.querySelector('[data-reject]').onclick = async () => {
      const reason = card.querySelector('#reason-'+e.id).value;
      if(!reason){ showToast('Bitte einen Ablehnungsgrund wählen'); return; }
      await resolveReview(e.id, false, null, reason);
      reviewFormDirty = false;
      await loadState(); render();
      showToast('Aufgabe abgelehnt ❌');
    };
  });
}

function renderVote(){
  const area = document.getElementById('panel-vote');
  const pending = pendingVotesForMe();
  const badge = document.getElementById('badgeVote');
  const notYetVoted = pending.filter(pv => !(pv.assignment.votes && pv.assignment.votes[identity.playerId]));
  if(notYetVoted.length){ badge.style.display='inline-block'; badge.textContent = notYetVoted.length; } else { badge.style.display='none'; }

  area.innerHTML = `<div class="section-title">Abstimmen<div class="rule"></div></div><div id="voteList"></div>`;
  const list = document.getElementById('voteList');
  if(pending.length === 0){
    list.innerHTML = `<div class="empty-state"><span class="ic">🗳️</span>Aktuell steht nichts zur Abstimmung an.</div>`;
    return;
  }
  list.innerHTML = pending.map(pv => {
    const p = S.players.find(x => x.id === pv.playerId);
    const votes = pv.assignment.votes || {};
    const yes = Object.values(votes).filter(v=>v==='yes').length;
    const no = Object.values(votes).filter(v=>v==='no').length;
    const eligible = S.players.filter(x => x.id !== pv.playerId).length;
    const collected = yes + no;
    const myVote = votes[identity.playerId] || null;
    const avatars = S.players.filter(x => x.id !== pv.playerId).map(v => {
      const vt = votes[v.id];
      const cls = vt==='yes' ? 'yes' : (vt==='no' ? 'no' : 'pending');
      return `<div class="vavatar ${cls}" title="${esc(v.name)}: ${vt||'wartet'}">${v.emoji}</div>`;
    }).join('');
    return `<div class="vote-card" id="vote-${pv.playerId}">
      <div class="meta">${p ? p.emoji + ' ' + esc(p.name) : 'Jemand'} · Hat die Aufgabe erledigt?</div>
      <h4>${esc(pv.assignment.task.title)}</h4>
      ${pv.assignment.proof ? (pv.assignment.proof.startsWith('data:image') ? `<img src="${pv.assignment.proof}" style="max-width:100%; border-radius:12px; margin:6px 0 12px; display:block;">` : `<p style="font-size:12.5px; color:var(--text-dim); margin:6px 0 12px;">Nachweis: „${esc(pv.assignment.proof)}"</p>`) : ''}
      <div class="vote-choice">
        <button class="btn btn-teal ${myVote==='yes' ? 'selected-vote' : ''}" data-vote="yes">Ja, erledigt${myVote==='yes' ? ' ✓' : ''}</button>
        <button class="btn btn-danger ${myVote==='no' ? 'selected-vote' : ''}" data-vote="no">Nein${myVote==='no' ? ' ✓' : ''}</button>
      </div>
      <div class="vote-box" style="border-top:none; padding-top:12px;">
        <div class="vote-row" style="color:var(--text-faint);"><span>${yes} Ja</span><span>${collected}/${eligible} abgestimmt</span><span>${no} Nein</span></div>
        <div class="vote-avatars">${avatars}</div>
        ${myVote ? `<div class="hint" style="margin-top:8px;">Du hast abgestimmt — du kannst deine Wahl noch ändern.</div>` : ''}
      </div>
    </div>`;
  }).join('');

  pending.forEach(pv => {
    const card = document.getElementById('vote-'+pv.playerId);
    card.querySelectorAll('[data-vote]').forEach(b => b.onclick = async () => {
      await castVote(pv.playerId, b.dataset.vote);
      await loadState(); render();
    });
  });
}

let rankPeriod = 'all';
let createFormDirty = false;
let reviewFormDirty = false;
let chatInputDirty = false;
function renderRanking(){
  const area = document.getElementById('panel-ranking');
  const sorted = [...S.players].sort((a,b) => rankPeriod==='all' ? b.xp-a.xp : b.weeklyXp-a.weeklyXp);
  area.innerHTML = `
    <div class="section-title">Rangliste<div class="rule"></div></div>
    <div class="period-toggle">
      <button class="${rankPeriod==='all'?'active':''}" data-period="all">Gesamt</button>
      <button class="${rankPeriod==='week'?'active':''}" data-period="week">Diese Woche</button>
    </div>
    <div class="card">
      ${sorted.map((p,i) => `<div class="rank-row ${p.id===identity.playerId?'me':''}"><div class="rank-num">${i+1}</div><div class="rank-avatar">${p.emoji}</div><div class="rank-name">${esc(p.name)}${p.title ? ` <span title="${esc(p.title.label)}">${p.title.emoji}</span>` : ''}</div><div class="rank-xp">${rankPeriod==='all'?p.xp:p.weeklyXp} XP</div></div>`).join('')}
    </div>
    ${renderPunishmentSection()}`;
  area.querySelectorAll('.period-toggle button').forEach(b => b.onclick = () => { rankPeriod = b.dataset.period; renderRanking(); });
  const propInput = document.getElementById('punishPropInput');
  const propBtn = document.getElementById('punishPropBtn');
  if(propBtn) propBtn.onclick = async () => {
    const text = propInput.value.trim();
    if(!text) return;
    propBtn.disabled = true;
    await proposePunishment(text);
    await loadState(); renderRanking();
  };
  area.querySelectorAll('[data-vote-punish]').forEach(btn => btn.onclick = async () => {
    btn.disabled = true;
    await voteForPunishment(btn.dataset.votePunish);
    await loadState(); renderRanking();
  });
}

function renderPunishmentSection(){
  if(!S.punishment) return '';
  const target = S.players.find(p => p.id === S.punishment.targetId);
  if(!target) return '';
  const proposals = [...S.punishment.proposals].sort((a,b) => (S.punishment.votes[b.id]||[]).length - (S.punishment.votes[a.id]||[]).length);
  const myVote = proposals.find(p => (S.punishment.votes[p.id]||[]).includes(identity.playerId));
  const maxVotes = proposals.length ? Math.max(...proposals.map(p => (S.punishment.votes[p.id]||[]).length)) : 0;
  return `
    <div class="section-title">😈 Strafe der Woche<div class="rule"></div></div>
    <div class="card">
      <div class="hint" style="margin:0 0 12px;">${target.emoji} <b style="color:var(--text);">${esc(target.name)}</b> war Schlusslicht letzte Woche — die Gruppe stimmt ab, welche echte Strafe fällig wird.</div>
      ${proposals.length === 0 ? `<div class="hint">Noch keine Vorschläge — sei der/die Erste.</div>` : proposals.map(p => {
        const votes = (S.punishment.votes[p.id]||[]).length;
        const isLeading = votes > 0 && votes === maxVotes;
        const isMine = myVote && myVote.id === p.id;
        return `<div class="card" style="margin-bottom:8px; ${isLeading ? 'border-color:var(--accent);' : ''}">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <div style="flex:1; font-size:13px;">${esc(p.text)}${isLeading ? ' 🏆' : ''}</div>
            <button class="btn ${isMine?'btn-primary':'btn-ghost'}" data-vote-punish="${p.id}" style="width:auto; padding:7px 12px; font-size:11px;">${votes} ${isMine?'✓':''}</button>
          </div>
        </div>`;
      }).join('')}
      <label style="margin-top:14px;">Eigenen Vorschlag einreichen</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="punishPropInput" placeholder="z. B. gibt allen einen aus" maxlength="120" style="flex:1;">
        <button class="btn btn-accent" id="punishPropBtn" style="width:auto; padding:11px 16px;">+</button>
      </div>
    </div>`;
}

/* ---------------- boot ---------------- */

async function boot(){
  if(!identity){ renderOnboarding(); return; }
  renderShell();
  await loadState();
  if(!S){
    await new Promise(r => setTimeout(r, 1000));
    await loadState();
  }
  if(!S){
    document.getElementById('app').innerHTML = `
      <div class="onboard"><div class="onboard-card">
        <div class="onboard-title">DAILY <span>CHALLENGE</span></div>
        <div class="empty-state" style="margin-top:20px;">
          <span class="ic">⚠️</span>
          Gruppendaten konnten nicht geladen werden — Cloud-Speicher gerade nicht erreichbar.
        </div>
        <button class="btn btn-accent" id="retryBoot" style="margin-top:14px;">Erneut versuchen</button>
      </div></div>`;
    document.getElementById('retryBoot').onclick = () => location.reload();
    return;
  }
  render();
  if(pollTimer) clearTimeout(pollTimer);
  schedulePoll();
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(async () => {
    const el = document.getElementById('countdownText');
    if(!el) return;
    const ms = msUntilNextMidnight();
    el.textContent = formatCountdown(ms);
    if(!document.hidden && ms <= 1500){
      await loadState();
      render();
    }
  }, 1000);
}

async function storageSelfTest(){
  if(HAS_CLAUDE_STORAGE){
    try{
      const k = 'dc:_selftest:' + genId();
      await sSet(k, {ping:'pong'}, true);
      const back = await sGet(k, true);
      return !!(back && back.ping === 'pong');
    }catch(e){ return false; }
  }
  try{
    const k = '_selftest_' + genId();
    localStorage.setItem(k, 'pong');
    const ok = localStorage.getItem(k) === 'pong';
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}

window.addEventListener('storage', async (e) => {
  if(!identity || !S || document.hidden || groupModalOpen) return;
  if(e.key && !e.key.startsWith(`dc:${identity.code}:`)) return;
  await loadState();
  render();
});

document.addEventListener('visibilitychange', async () => {
  if(!document.hidden && identity && S && !groupModalOpen){
    await loadState();
    render();
  }
});

(async () => {
  await loadIdentity();
  if(!identity){
    const ok = await storageSelfTest();
    if(!ok){
      document.getElementById('app').innerHTML = `
        <div class="onboard"><div class="onboard-card">
          <div class="onboard-title">DAILY <span>CHALLENGE</span></div>
          <div class="empty-state" style="margin-top:20px;">
            <span class="ic">⚠️</span>
            ${HAS_CLAUDE_STORAGE ? 'Der geteilte Speicher antwortet gerade nicht.' : 'Dein Browser blockiert gerade lokalen Speicher (z. B. Privater Modus).'}<br><br>
            Das ist kein Tippfehler-Problem beim Code — versuch es gleich noch einmal${HAS_CLAUDE_STORAGE ? '' : ', am besten in einem normalen Browserfenster (nicht privat/inkognito)'}.
          </div>
          <button class="btn btn-ghost" id="retryTest" style="margin-top:14px;">Erneut versuchen</button>
        </div></div>`;
      document.getElementById('retryTest').onclick = () => location.reload();
      return;
    }
  }
  await boot();
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => console.error('SW registration failed', err));
  });
}
