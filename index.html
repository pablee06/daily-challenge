<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Daily Challenge — Multiplayer-Probeversion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563EB">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Challenge">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://tasqaanfdbdrvibeadfs.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F9FB; --bg-alt:#fff; --bg-alt2:#EEF0F3;
  --paper:#fff; --paper-edge:#E2E5EA;
  --accent:#2563EB; --accent-d:#1D4ED8; --accent-ink:#fff; --accent-2:#16A34A;
  --danger:#DC2626; --success:#16A34A; --peach:#D97706;
  --text:#111827; --text-dim:#6B7280; --text-faint:#9CA3AF;
  --ink:#111827; --radius:12px;
  --font-display:'Inter',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:90px;
}
::selection{background:var(--accent); color:#fff;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.wrap{max-width:640px; margin:0 auto; padding:0 16px;}

header{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--paper-edge);}
.header-inner{max-width:640px; margin:0 auto; padding:18px 16px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .stamp-title{font-family:var(--font-display); font-weight:900; font-style:italic; letter-spacing:-0.3px; font-size:19px; line-height:1; color:var(--text); cursor:pointer; display:inline-block; transform:skewX(-6deg);}
.brand .stamp-title span{background:linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.grp-btn{background:var(--bg-alt); border:1px solid var(--paper-edge); color:var(--text); border-radius:50%; width:34px; height:34px; padding:0; font-family:'Inter',sans-serif; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.header-stats{display:flex; align-items:center; gap:14px;}
.stat{text-align:right;}
.stat .n{font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--accent);}
.stat .l{font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.6px; font-weight:700;}
.day-bar{display:flex; align-items:center; justify-content:space-between; max-width:640px; margin:0 auto; padding:0 16px 14px; gap:10px;}
.day-pill{font-family:'Inter',sans-serif; font-weight:600; font-size:12px; color:var(--text-dim); background:var(--bg-alt); border:1px solid var(--paper-edge); padding:6px 12px; border-radius:20px;}
.day-pill b{color:var(--accent); font-family:var(--font-display);}
.countdown-pill{font-family:'Inter',sans-serif; font-size:12px; font-weight:600; background:var(--bg-alt); border:1px solid var(--paper-edge); color:var(--text-dim); padding:6px 12px; border-radius:20px; letter-spacing:0.1px; display:flex; align-items:center; gap:6px;}
.countdown-pill b{color:var(--accent); font-family:var(--font-display); letter-spacing:0.3px;}
.refresh-btn{background:none; border:none; color:var(--text-faint); font-size:15px; cursor:pointer; padding:4px 6px;}
.refresh-btn.spin{animation:spin 0.7s linear;}
.loading-spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--paper-edge); border-top-color:var(--accent); animation:spin 0.8s linear infinite; margin:0 auto;}
#globalLoadBar{position:fixed; top:0; left:0; height:3px; width:0%; background:var(--accent); z-index:9999; opacity:0; pointer-events:none;}
#globalLoadBar.active{opacity:1; width:72%; transition:width 2.2s cubic-bezier(.15,.6,.2,1), opacity 0.2s ease;}
#globalLoadBar.done{width:100%; opacity:1; transition:width 0.2s ease, opacity 0.15s ease 0.1s;}
.load-stars{display:flex; gap:9px; justify-content:center; margin:28px 0 16px; font-size:27px; line-height:1;}
.load-star{color:var(--paper-edge); transition:color 0.25s ease, text-shadow 0.25s ease; display:inline-block;}
.load-star.filled{color:#f4b942; text-shadow:0 0 10px rgba(244,185,66,0.55);}
.load-star.pop{animation:starPop 0.45s ease;}
@keyframes starPop{0%{transform:scale(1) rotate(0);} 45%{transform:scale(1.45) rotate(-8deg);} 100%{transform:scale(1) rotate(0);}}
@keyframes spin{to{transform:rotate(360deg);}}

.tabs{display:flex; justify-content:space-around; gap:2px; max-width:640px; margin:0 auto 22px; padding:0; border-bottom:1px solid var(--paper-edge); width:100%;}
.tab-btn{flex:1; background:none; border:none; color:var(--text-faint); font-family:'Inter',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.2px; padding:10px 2px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab-btn .ic{font-size:15px;}
.tab-btn.active{color:var(--accent); border-color:var(--accent);}

main{max-width:640px; margin:0 auto; padding:0 16px;}
.panel{display:none;}
.panel.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
.section-title{font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:0.1px; color:var(--text); margin:24px 0 12px; display:flex; align-items:center; gap:8px;}
.section-title:first-child{margin-top:4px;}
.section-title .rule{flex:1; height:1px; background:var(--paper-edge);}

.ticket{position:relative; background:var(--paper); color:var(--ink); border-radius:var(--radius); padding:22px 20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(17,24,39,0.06); border:1px solid var(--paper-edge);}
.ticket .perf{display:none;}
.ticket-top, .ticket-bottom{position:relative; z-index:1;}
.ticket-top{padding-bottom:14px;} .ticket-bottom{padding-top:2px;}
.ticket-cat{display:inline-block; font-family:'Inter',sans-serif; font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin-bottom:10px;}
.ticket-title{font-family:var(--font-display); font-weight:700; font-size:20px; line-height:1.3; margin:0 0 8px;}
.ticket-desc{font-size:13.5px; line-height:1.55; color:var(--text-dim); margin:0;}
.ticket-meta{display:flex; align-items:center; gap:14px; margin-top:16px; flex-wrap:wrap; padding-top:14px; border-top:1px solid var(--paper-edge);}
.ticket-by{font-family:'Inter',sans-serif; font-size:10px; opacity:0.5; margin-top:6px;}
.stamp{display:inline-flex; align-items:center; justify-content:center; flex-direction:column; width:auto; min-width:56px; height:auto; padding:2px 4px; border-radius:0; border:none; transform:none; font-family:var(--font-display); letter-spacing:0.1px; position:relative;}
.stamp::before{display:none;}
.stamp .p{font-size:20px; line-height:1; font-weight:700; color:var(--peach);} .stamp .d{font-size:9px; text-transform:uppercase; letter-spacing:0.5px; margin-top:3px; font-weight:700; color:var(--text-faint); font-family:'Inter',sans-serif;}
.stamp.easy .p{color:var(--success);} .stamp.normal .p{color:var(--peach);} .stamp.hard .p{color:var(--danger);}
.proof-tag{font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; color:var(--text-dim); border:none; padding:3px 0; border-radius:0;}
.status-tag{font-family:'Inter',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.1px; padding:6px 13px; border-radius:20px; text-transform:none;}
.status-tag.voting{background:color-mix(in srgb, var(--peach) 18%, transparent); color:var(--peach);}
.status-tag.completed{background:color-mix(in srgb, var(--success) 18%, transparent); color:var(--success);}
.status-tag.failed{background:color-mix(in srgb, var(--danger) 18%, transparent); color:var(--danger);}
.status-tag.missed{background:color-mix(in srgb, var(--danger) 18%, transparent); color:var(--danger);}

.btn{font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; border:none; border-radius:10px; padding:13px 16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%; letter-spacing:0.1px; transition:opacity .15s, transform .1s;}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.45; cursor:default;}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{opacity:0.92;}
.btn-accent{background:var(--peach); color:#fff;}
.btn-teal{background:var(--success); color:#fff;}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
.btn-ghost{background:var(--bg-alt2); color:var(--text);}
.ticket-menu{display:none; position:absolute; right:0; bottom:calc(100% + 6px); background:var(--paper); border:1px solid var(--paper-edge); border-radius:10px; box-shadow:0 6px 20px rgba(17,24,39,0.14); min-width:180px; overflow:hidden; z-index:30;}
.ticket-menu.open{display:block;}
.ticket-menu-item{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left; background:none; border:none; padding:12px 14px; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:700; color:var(--text); cursor:pointer;}
.ticket-menu-item:hover, .ticket-menu-item:active{background:var(--bg-alt2);}
.confetti-container{position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden;}
.confetti-piece{position:absolute; top:-12px; width:8px; height:14px; border-radius:2px; opacity:0.9; animation-name:confetti-fall; animation-timing-function:ease-in; animation-fill-mode:forwards;}
@keyframes confetti-fall{ to{ transform:translateY(108vh) rotate(720deg); opacity:0.25; } }

.chest-overlay{position:fixed; inset:0; background:rgba(11,16,32,0.72); z-index:9998; display:flex; align-items:center; justify-content:center; padding:20px; animation:chest-fade-in .2s ease;}
@keyframes chest-fade-in{ from{opacity:0;} to{opacity:1;} }
.chest-modal{background:var(--paper); border-radius:20px; padding:32px 28px; text-align:center; max-width:300px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.3);}
.chest-title{font-family:var(--font-display); font-weight:900; font-style:italic; font-size:19px; margin-bottom:10px; transform:skewX(-6deg);}

.chest-scene{position:relative; width:150px; height:150px; margin:0 auto; cursor:pointer; user-select:none; filter:drop-shadow(0 10px 14px rgba(0,0,0,0.25));}
.chest-scene:not(.chest-opened):active{transform:scale(0.96);}
.chest-svg{width:100%; height:100%; overflow:visible;}
.chest-shadow{fill:rgba(0,0,0,0.18);}
#chestLid{transform-origin:80px 84px; transition:transform .5s cubic-bezier(.34,1.7,.5,1);}
.chest-opened #chestLid{transform:rotate(-122deg) translate(-4px,-4px);}
.chest-opened #chestBody{animation:chest-body-pop .45s ease;}
@keyframes chest-body-pop{ 0%{transform:scale(1);} 40%{transform:scale(1.07,0.9);} 100%{transform:scale(1);} }

.chest-wood .chest-body-fill{fill:#8a5a2b;}
.chest-wood .chest-lid-fill{fill:#c08c4e;}
.chest-wood .chest-band{fill:#5e3c1c;}
.chest-wood .chest-lock{fill:#FACC15;}
.chest-silver .chest-body-fill{fill:#9aa5b8;}
.chest-silver .chest-lid-fill{fill:#eef1f6;}
.chest-silver .chest-band{fill:#6e7891;}
.chest-silver .chest-lock{fill:#FACC15;}
.chest-gold .chest-body-fill{fill:#b8860b;}
.chest-gold .chest-lid-fill{fill:#f4c542;}
.chest-gold .chest-band{fill:#8a6508;}
.chest-gold .chest-lock{fill:#7a2fd6;}

.chest-shake{animation:chest-shake-kf .48s ease;}
@keyframes chest-shake-kf{
  0%,100%{transform:rotate(0deg) scale(1);}
  15%{transform:rotate(-7deg) scale(1.02);}
  30%{transform:rotate(7deg) scale(1.02);}
  45%{transform:rotate(-6deg) scale(1.04);}
  60%{transform:rotate(6deg) scale(1.04);}
  75%{transform:rotate(-3deg) scale(1.06);}
  90%{transform:rotate(3deg) scale(1.06);}
}

.chest-glow{position:absolute; left:50%; top:46%; width:10px; height:10px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%); opacity:0; pointer-events:none;}
.chest-opened .chest-glow{animation:chest-glow-kf .65s ease-out forwards;}
@keyframes chest-glow-kf{ 0%{width:10px; height:10px; opacity:0.95;} 100%{width:230px; height:230px; opacity:0;} }

.chest-sparkle{position:absolute; left:50%; top:46%; font-size:17px; transform:translate(-50%,-50%); animation:chest-sparkle-kf .85s ease-out forwards; pointer-events:none;}
@keyframes chest-sparkle-kf{
  0%{ transform:translate(-50%,-50%) scale(0.3) rotate(0deg); opacity:1; }
  100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15) rotate(90deg); opacity:0; }
}

.chest-reward-text{font-family:var(--font-display); font-weight:800; font-size:21px; color:var(--accent);}

.vote-box{margin-top:14px; padding-top:14px; border-top:1px solid var(--paper-edge);}
.vote-row{display:flex; justify-content:space-between; font-family:'Inter',sans-serif; font-weight:600; font-size:11px; color:var(--text-dim); margin-bottom:6px;}
.vote-track{height:8px; border-radius:5px; background:var(--bg-alt2); overflow:hidden; display:flex;}
.vote-yes{background:var(--success); height:100%;} .vote-no{background:var(--danger); height:100%;}
.vote-avatars{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.vavatar{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; border:2px solid transparent; background:var(--bg-alt2);}
.vavatar.yes{border-color:var(--success);} .vavatar.no{border-color:var(--danger);} .vavatar.pending{opacity:0.35;}

.card{background:var(--paper); border:1px solid var(--paper-edge); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(17,24,39,0.04);}
.empty-state{background:var(--paper); border:1px dashed var(--paper-edge); border-radius:var(--radius); padding:26px 18px; text-align:center; color:var(--text-dim); font-size:13px; line-height:1.6;}
.empty-state .ic{font-size:26px; display:block; margin-bottom:8px;}

label{display:block; font-family:'Inter',sans-serif; font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-faint); margin:14px 0 6px;}
label:first-child{margin-top:0;}
input[type=text], textarea, select{width:100%; background:var(--bg-alt2); border:1.5px solid transparent; color:var(--text); border-radius:8px; padding:11px 13px; font-family:'Inter',sans-serif; font-size:14px;}
input[type=text]:focus, textarea:focus, select:focus{border-color:var(--accent); outline:none;}
textarea{resize:vertical; min-height:64px;}
.chip-row{display:flex; flex-wrap:wrap; gap:7px;}
.chip{font-family:'Inter',sans-serif; font-weight:600; font-size:11.5px; padding:7px 13px; border-radius:20px; background:transparent; color:var(--text-dim); border:1.5px solid var(--paper-edge); cursor:pointer;}
.chip.selected{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700;}
.slots-row{display:flex; gap:8px; margin-bottom:14px;}
.slot-dot{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; background:var(--bg-alt2); border:1px solid var(--paper-edge);}
.slot-dot.filled{background:var(--accent); color:#fff; border-color:var(--accent);}

.rank-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--paper-edge);}
.rank-row:last-child{border-bottom:none;}
.rank-num{font-family:var(--font-display); font-weight:700; font-size:16px; width:24px; color:var(--text-faint);}
.rank-row.me .rank-num{color:var(--accent);}
.rank-avatar{width:34px; height:34px; border-radius:50%; background:var(--bg-alt2); display:flex; align-items:center; justify-content:center; font-size:16px;}
.rank-name{flex:1; font-weight:600; font-size:13.5px;}
.rank-row.me .rank-name{color:var(--accent);}
.rank-xp{font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--text-dim);}
.period-toggle{display:flex; gap:6px; margin-bottom:14px;}
.period-toggle button{flex:1; background:var(--paper); border:1px solid var(--paper-edge); color:var(--text-dim); font-family:'Inter',sans-serif; font-weight:700; font-size:11px; padding:8px; border-radius:8px; cursor:pointer;}
.period-toggle button.active{background:var(--accent); color:#fff; border-color:var(--accent);}

.review-card{background:var(--paper); border:1px solid var(--paper-edge); border-radius:var(--radius); padding:18px; margin-bottom:12px; box-shadow:0 1px 3px rgba(17,24,39,0.04);}
.review-card h4{margin:0 0 4px; font-family:var(--font-display); font-weight:700; font-size:16px;}
.review-card .cat{font-family:'Inter',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:0.8px; color:var(--accent); text-transform:uppercase; margin-bottom:8px;}
.review-card p{font-size:13px; color:var(--text-dim); line-height:1.5; margin:0 0 12px;}
.diff-picker{display:flex; gap:8px; margin-bottom:10px;}
.diff-btn{flex:1; padding:11px 4px; border-radius:8px; border:1.5px solid var(--paper-edge); background:transparent; color:var(--text-dim); font-family:'Inter',sans-serif; font-weight:600; font-size:11px; cursor:pointer; text-align:center;}
.diff-btn b{display:block; font-family:var(--font-display); font-size:15px;}
.diff-btn.easy.selected{border-color:var(--success); color:var(--success); background:color-mix(in srgb, var(--success) 12%, transparent);}
.diff-btn.normal.selected{border-color:var(--peach); color:var(--peach); background:color-mix(in srgb, var(--peach) 12%, transparent);}
.diff-btn.hard.selected{border-color:var(--danger); color:var(--danger); background:color-mix(in srgb, var(--danger) 12%, transparent);}
.reason-select{margin-bottom:10px;}
.vote-card{background:var(--paper); border:1px solid var(--paper-edge); border-radius:var(--radius); padding:18px; margin-bottom:12px; box-shadow:0 1px 3px rgba(17,24,39,0.04);}
.vote-card h4{margin:0 0 4px; font-family:var(--font-display); font-weight:700; font-size:16px;}
.vote-card .meta{font-family:'Inter',sans-serif; font-weight:700; font-size:10.5px; color:var(--text-faint); margin-bottom:10px;}
.vote-choice{display:flex; gap:8px;}
.vote-choice .btn{flex:1;}
.vote-choice .btn.selected-vote{outline:2px solid var(--accent); outline-offset:2px;}

.log-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--paper-edge); font-size:12.5px; color:var(--text-dim);}
.log-item.chat{border-bottom:none; padding:6px 0;}
.chat-bubble{background:var(--bg-alt2); border-left:3px solid var(--accent); border-radius:10px; padding:9px 12px; display:flex; gap:10px; font-size:13px; color:var(--text); width:100%;}
.chat-bubble .day-tag{color:var(--text-faint);}
.log-item .day-tag{font-family:'Inter',sans-serif; font-weight:700; font-size:10px; color:var(--text-faint); white-space:nowrap; padding-top:1px;}
.log-item b{color:var(--text);}

nav.bottom{position:fixed; bottom:0; left:0; right:0; z-index:30; background:transparent; display:flex; justify-content:center; padding:0 16px calc(env(safe-area-inset-bottom,0) + 14px);}
nav.bottom button{flex:1; max-width:80px; background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 1px; font-family:'Inter',sans-serif; font-weight:700; font-size:9px; letter-spacing:0.1px; position:relative;}
nav.bottom button .ic{font-size:18px;}
nav.bottom button.active{color:var(--accent);}
nav.bottom{background:var(--bg-alt); border:1px solid var(--paper-edge); border-radius:18px; margin:0 auto 10px; max-width:400px; box-shadow:0 4px 16px rgba(17,24,39,0.08); padding:10px 10px calc(env(safe-area-inset-bottom,0) + 10px);}
nav.bottom .navbadge{position:absolute; top:2px; right:14%; background:var(--danger); color:#fff; font-size:8.5px; font-weight:700; border-radius:8px; padding:0 5px;}

#toast{position:fixed; top:12px; left:50%; transform:translateX(-50%) translateY(-60px); background:var(--text); color:#fff; font-weight:600; font-size:13px; padding:10px 18px; border-radius:30px; z-index:100; box-shadow:0 8px 20px rgba(0,0,0,0.2); transition:transform .35s cubic-bezier(.34,1.56,.64,1); pointer-events:none; max-width:80vw; text-align:center;}
#toast.show{transform:translateX(-50%) translateY(0);}
.hint{font-size:12px; color:var(--text-faint); line-height:1.5; margin:8px 0 0;}
.creator-note{font-size:11.5px; color:var(--text-faint); margin-top:-4px; margin-bottom:14px; line-height:1.5;}

/* onboarding */
.onboard{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
.onboard-card{width:100%; max-width:400px;}
.onboard-title{font-family:var(--font-display); font-weight:900; font-style:italic; font-size:32px; text-align:center; margin:0 0 6px; letter-spacing:-0.4px;}
.onboard-title span{display:inline-block; background:linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; transform:skewX(-6deg);}
.onboard-sub{text-align:center; color:var(--text-dim); font-size:13px; margin:0 0 30px; line-height:1.6;}
.ob-choice{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
.ob-back{background:none; border:none; color:var(--text-faint); font-family:'Inter',sans-serif; font-weight:700; font-size:11px; cursor:pointer; margin-bottom:16px; padding:0;}
.code-display{font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:3px; text-align:center; background:var(--bg-alt2); border:1px dashed var(--paper-edge); border-radius:10px; padding:16px; margin:16px 0; color:var(--accent);}

/* group modal */
.modal-overlay{position:fixed; inset:0; background:rgba(17,24,39,0.45); backdrop-filter:blur(2px); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{background:var(--bg); width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:22px 18px calc(env(safe-area-inset-bottom,0) + 20px); max-height:80vh; overflow-y:auto; border-top:1px solid var(--paper-edge);}
.modal-sheet h3{font-family:var(--font-display); font-weight:700; font-size:19px; margin:0 0 14px; display:flex; justify-content:space-between; align-items:center;}
.modal-close{background:var(--bg-alt2); border:none; color:var(--text); font-size:16px; cursor:pointer; width:28px; height:28px; border-radius:50%;}
.tour-box{position:fixed; z-index:51; border:2px solid var(--accent); border-radius:14px; pointer-events:none; transition:top .25s ease, left .25s ease, width .25s ease, height .25s ease, border-radius .25s ease; box-shadow:0 0 0 9999px rgba(17,24,39,0.62);}
.tour-tip{position:fixed; z-index:52; background:var(--paper); border:1px solid var(--paper-edge); border-radius:var(--radius); padding:14px 16px; box-shadow:0 8px 28px rgba(17,24,39,0.22); max-width:320px;}
.tour-target{position:relative; z-index:51;}
.member-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--paper-edge);}
.member-row:last-child{border-bottom:none;}
.member-row .rank-avatar{width:30px; height:30px; font-size:14px;}

/* themes */
.theme-card{background:var(--paper); border:1.5px solid var(--paper-edge); border-radius:var(--radius); padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:12px;}
.theme-card.owned-active{border-color:var(--accent);}
.theme-swatch{width:44px; height:44px; border-radius:10px; flex-shrink:0; border:1px solid rgba(0,0,0,0.06);}
.theme-card .info{flex:1;}
.theme-card .info b{font-family:'Inter',sans-serif; font-size:13.5px; font-weight:700; display:block;}
</style>
</head>

function showChangelogModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3>Was ist neu <button class="modal-close" id="changelogClose">✕</button></h3>
      ${CHANGELOG.map(c => `
        <div class="card">
          <div style="font-weight:800; margin-bottom:6px;">${c.v}</div>
          <ul style="margin:0; padding-left:18px; font-size:13px; line-height:1.6;">
            ${c.items.map(i => `<li>${i}</li>`).join('')}
          </ul>
        </div>`).join('')}
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  overlay.querySelector('#changelogClose').onclick = () => overlay.remove();
}
(() => { const t = document.getElementById('appVersionTag'); if(t){ t.textContent = APP_VERSION; t.onclick = showChangelogModal; } })();

  if(!stars.length) return;
  const filledCount = Math.ceil((pct / 100) * stars.length);
  stars.forEach((s, i) => {
    const shouldFill = i < filledCount;
    const wasFilled = s.classList.contains('filled');
    if(shouldFill && !wasFilled){
      s.classList.add('filled', 'pop');
      setTimeout(() => s.classList.remove('pop'), 450);
    } else if(!shouldFill && wasFilled){
      s.classList.remove('filled');
    }
  });
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for(let i=0; i<raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

async function withRetry(fn, attempts=3){
  requestStart();
  try{
    let lastErr;
    for(let i=0; i<attempts; i++){
      try{ return await fn(); }
      catch(e){
        lastErr = e;
        const msg = (e && e.message) || '';
        if(/rate limit/i.test(msg)) throw e; // don't hammer further on a rate limit
        if(i < attempts-1) await new Promise(r => setTimeout(r, 400 * (i+1)));
      }
    }
    throw lastErr;
  } finally {
    requestEnd();
  }
}

/* ---------------- globale Ladeanzeige ----------------
   Dünner Balken ganz oben, erscheint automatisch bei JEDEM laufenden
   Netzwerk-Request (via withRetry) — egal ob Boot, Poll, Abstimmen, Chat
   senden usw. Keine einzelne Aktion muss das selbst ansteuern. */
let activeRequestCount = 0;
let globalBarResetTimer = null;
function requestStart(){
  activeRequestCount++;
  const bar = document.getElementById('globalLoadBar');
  if(bar && activeRequestCount === 1){
    clearTimeout(globalBarResetTimer);
    bar.classList.remove('done');
    void bar.offsetWidth; // Reflow erzwingen, damit die Breiten-Animation jedes Mal neu von vorn startet
    bar.classList.add('active');
  }
}
function requestEnd(){
  activeRequestCount = Math.max(0, activeRequestCount - 1);
  if(activeRequestCount === 0){
    const bar = document.getElementById('globalLoadBar');
    if(bar){
      bar.classList.remove('active');
      bar.classList.add('done');
      globalBarResetTimer = setTimeout(() => { bar.classList.remove('done'); }, 260);
    }
  }
}

    const store = localStorage; // both shared and device-local data persist in localStorage now, so identity survives real app restarts on phones
    store.removeItem(key);
    return true;
  }catch(e){ return null; }
}
function suffix(key, prefix){ return key.slice(prefix.length); }

// Liste + Werte in einem Rutsch, als {key, value}-Paare. Bei Supabase ein
// einziger Request statt "Keys listen, dann jeden Wert einzeln holen".
async function sListGet(prefix, shared){
  if(shared && isSupabase()){
    try{
      const rows = await withRetry(() => sbRowListWithValues(remoteBlobId, prefix));
      return rows.filter(r => r.value !== null && r.value !== undefined);
    }catch(e){ console.error('supabase list+get failed', prefix, e); return []; }
  }
  const keys = await sList(prefix, shared);
  const vals = await Promise.all(keys.map(k => sGet(k, shared)));
  return keys.map((k,i) => ({key:k, value:vals[i]})).filter(r => r.value !== null && r.value !== undefined);
}
// Wie sListGet, aber nur die neuesten "limit" Einträge (für den Chat/Log).
async function sListGetLatest(prefix, limit, shared){
  if(shared && isSupabase()){
    try{ return await withRetry(() => sbRowsLatestByPrefix(remoteBlobId, prefix, limit)); }
    catch(e){ console.error('supabase latest failed', prefix, e); return []; }
  }
  const keys = (await sList(prefix, shared)).sort().reverse().slice(0, limit);
  const vals = await Promise.all(keys.map(k => sGet(k, shared)));
  return keys.map((k,i) => ({key:k, value:vals[i]})).filter(r => r.value !== null && r.value !== undefined);
}
// Werte für mehrere Präfixe auf einmal (z.B. Reaktionen mehrerer Log-Einträge,
// Stimmen mehrerer Spieler) — bei Supabase ein Request statt einem pro Präfix.
async function sListGetMulti(prefixes, shared){
  if(shared && isSupabase()){
    try{ return await withRetry(() => sbRowsForPrefixes(remoteBlobId, prefixes)); }
    catch(e){ console.error('supabase multi-prefix failed', e); return []; }
  }
  const results = await Promise.all(prefixes.map(p => sListGet(p, shared)));
  return results.flat();
}

function pad2(n){ return String(n).padStart(2,'0'); }
function localDateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseLocalDateStr(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function computeDayCycle(startDateStr){
  const start = parseLocalDateStr(startDateStr);
  const today = parseLocalDateStr(localDateStr(new Date()));
  const diff = Math.round((today - start) / 86400000);
  const day = Math.max(diff + 1, 1);
  const cycle = Math.floor((day - 1) / 2) + 1;
  return {day, cycle};
}
function msUntilNextMidnight(){
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
  return next - now;
}
function formatCountdown(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
}

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const hashBuf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function genId(){ return Math.random().toString(36).slice(2,10); }

async function findExistingMemberByName(code, name){
  const memberKeys = await sList(`dc:${code}:member:`, true);
  const nameLower = name.trim().toLowerCase();
  for(const k of memberKeys){
    const v = await sGet(k, true);
    if(v && v.name && v.name.trim().toLowerCase() === nameLower){
      return {playerId: suffix(k, `dc:${code}:member:`), rec: v};
    }
  }
  return null;
}

// Given a backend is already routable (identity/remoteBlobId set up), either
// reclaims an existing member by name+personal-password, or creates a new one.
// Legacy members with no pwHash yet accept any password and claim it on first login.
async function loginOrCreateMember(code, name, personalPw){
  const salt = name.trim().toLowerCase() + ':' + code;
  const hash = await sha256(personalPw + salt);
  const existing = await findExistingMemberByName(code, name);
  if(existing){
    if(existing.rec.pwHash && existing.rec.pwHash !== hash){
      return {error: 'Falscher Name oder falsches Passwort'};
    }
    if(!existing.rec.pwHash){
      await sSet(`dc:${code}:member:${existing.playerId}`, memberPayload(existing.rec, {pwHash: hash}), true);
    }
    return {playerId: existing.playerId, rec: existing.rec, isNew:false};
  }
  const playerId = 'p_' + genId();
  const rec = {name, emoji: EMOJIS[Math.floor(Math.random()*EMOJIS.length)], xp:100, weeklyXp:0, ownedThemes:['plain'], selectedTheme:'plain', pwHash: hash, freeJokers:1, lastLoginBonusDay:0, shopDiscountPct:0, chestLog:[], streakFreezes:1};
  await sSet(`dc:${code}:member:${playerId}`, rec, true);
  return {playerId, rec, isNew:true};
}

async function createGroup(name, personalPw, groupPw){
  const startDate = localDateStr(new Date());
  if(HAS_CLAUDE_STORAGE){
    const code = genCode();
    await sSet(`dc:${code}:daystart`, startDate, true);
    if(groupPw) await sSet(`dc:${code}:pwhash`, await sha256(groupPw+code), true);
    const {playerId} = await loginOrCreateMember(code, name, personalPw);
    identity = {code, playerId, playerName:name, joinedDay:1, remote:false};
    await sSet('my-identity', identity, false);
    await boot();
    return;
  }
  if(hasSupabase()){
    try{
      const code = genCode();
      remoteBlobId = code;
      identity = {code:'S-'+code, playerId:null, playerName:name, remote:true, backend:'supabase'};
      await sSet(`dc:${code}:daystart`, startDate, true);
      if(groupPw) await sSet(`dc:${code}:pwhash`, await sha256(groupPw+code), true);
      const {playerId} = await loginOrCreateMember(code, name, personalPw);
      identity = {code:'S-'+code, playerId, playerName:name, joinedDay:1, remote:true, backend:'supabase'};
      await sSet('my-identity', identity, false);
      await boot();
      return;
    }catch(e){
      console.error('supabase group creation failed, falling back', e);
    }
  }
  if(hasAppsScript()){
    try{
      const code = genCode();
      remoteBlobId = code;
      const pwProof = groupPw ? await sha256(groupPw+code) : '';
      remoteDoc = {};
      remoteDoc[`dc:${code}:daystart`] = startDate;
      remoteDirty = true;
      identity = {code:'G-'+code, playerId:null, playerName:name, remote:true, backend:'appsscript', pwProof};
      const {playerId} = await loginOrCreateMember(code, name, personalPw);
      identity = {code:'G-'+code, playerId, playerName:name, joinedDay:1, remote:true, backend:'appsscript', pwProof};
      await sSet('my-identity', identity, false);
      await boot();
      return;
    }catch(e){
      console.error('apps script group creation failed, falling back', e);
    }
  }
  // try the free remote backend so friends on other PCs can join without any account
  try{
    const blobId = await remoteCreate();
    remoteBlobId = blobId;
    remoteDoc = {};
    remoteDoc[`dc:${blobId}:daystart`] = startDate;
    if(groupPw) remoteDoc[`dc:${blobId}:pwhash`] = await sha256(groupPw+blobId);
    remoteDirty = true;
    identity = {code: 'R-'+blobId, playerId:null, playerName:name, remote:true};
    const {playerId} = await loginOrCreateMember(blobId, name, personalPw);
    identity = {code: 'R-'+blobId, playerId, playerName:name, joinedDay:1, remote:true};
    await sSet('my-identity', identity, false);
    await boot();
  }catch(e){
    console.error('remote group creation failed, falling back to local-only', e);
    const code = genCode();
    identity = {code, playerId:null, playerName:name, remote:false};
    await sSet(`dc:${code}:daystart`, startDate, true);
    if(groupPw) await sSet(`dc:${code}:pwhash`, await sha256(groupPw+code), true);
    const {playerId} = await loginOrCreateMember(code, name, personalPw);
    identity = {code, playerId, playerName:name, joinedDay:1, remote:false};
    await sSet('my-identity', identity, false);
    await boot();
    showToast('Cloud-Speicher nicht erreichbar — Gruppe funktioniert nur auf diesem PC');
  }
}

async function joinGroup(codeRaw, name, personalPw, groupPw){
  const raw = codeRaw.replace(/\s+/g, '');
  if(raw.toUpperCase().startsWith('S-')){
    const code = raw.slice(2);
    try{
      const storedHash = await sbRowGet(code, `dc:${code}:pwhash`);
      if(storedHash){
        if(!groupPw){ showToast('Diese Gruppe ist passwortgeschützt'); return false; }
        if(await sha256(groupPw+code) !== storedHash){ showToast('Falsches Passwort'); return false; }
      }
      remoteBlobId = code;
      identity = {code:'S-'+code, playerId:null, playerName:name, remote:true, backend:'supabase'};
      const startDateS = (await sGet(`dc:${code}:daystart`, true)) || localDateStr(new Date());
      const loginS = await loginOrCreateMember(code, name, personalPw);
      if(loginS.error){ showToast(loginS.error); identity = null; return false; }
      identity = {code:'S-'+code, playerId:loginS.playerId, playerName:name, joinedDay: computeDayCycle(startDateS).day, remote:true, backend:'supabase'};
      await sSet('my-identity', identity, false);
      await boot();
      return true;
    }catch(e){
      identity = null;
      showToast('Gruppencode nicht gefunden oder Cloud-Speicher nicht erreichbar');
      return false;
    }
  }
  if(raw.toUpperCase().startsWith('G-')){
    const code = raw.slice(2);
    try{
      const pwProof = groupPw ? await sha256(groupPw+code) : '';
      const check = await appsScriptCheckPassword(code, pwProof);
      if(check.hasPassword && !check.valid){
        showToast(groupPw ? 'Falsches Passwort' : 'Diese Gruppe ist passwortgeschützt');
        return false;
      }
      remoteBlobId = code;
      identity = {code:'G-'+code, playerId:null, playerName:name, remote:true, backend:'appsscript', pwProof};
      await remoteFetch();
      const startDateG = remoteDoc[`dc:${code}:daystart`] || localDateStr(new Date());
      const loginG = await loginOrCreateMember(code, name, personalPw);
      if(loginG.error){ showToast(loginG.error); identity = null; return false; }
      identity = {code:'G-'+code, playerId:loginG.playerId, playerName:name, joinedDay: computeDayCycle(startDateG).day, remote:true, backend:'appsscript', pwProof};
      await sSet('my-identity', identity, false);
      await boot();
      return true;
    }catch(e){
      identity = null;
      showToast('Gruppencode nicht gefunden oder Backend nicht erreichbar');
      return false;
    }
  }
  if(raw.toUpperCase().startsWith('R-')){
    const blobId = raw.slice(2);
    try{
      remoteBlobId = blobId;
      await remoteFetch();
      const storedHash = remoteDoc[`dc:${blobId}:pwhash`];
      if(storedHash){
        if(!groupPw){ showToast('Diese Gruppe ist passwortgeschützt'); return false; }
        if(await sha256(groupPw+blobId) !== storedHash){ showToast('Falsches Passwort'); return false; }
      }
      const startDateR = remoteDoc[`dc:${blobId}:daystart`] || localDateStr(new Date());
      identity = {code: 'R-'+blobId, playerId:null, playerName:name, remote:true};
      const loginR = await loginOrCreateMember(blobId, name, personalPw);
      if(loginR.error){ showToast(loginR.error); identity = null; return false; }
      identity = {code: 'R-'+blobId, playerId:loginR.playerId, playerName:name, joinedDay: computeDayCycle(startDateR).day, remote:true};
      await sSet('my-identity', identity, false);
      await boot();
      return true;
    }catch(e){
      showToast('Gruppencode nicht gefunden oder Cloud-Speicher nicht erreichbar');
      return false;
    }
  }
  const code = raw.toUpperCase();
  let startDate = null;
  for(let attempt = 0; attempt < 4 && !startDate; attempt++){
    if(attempt > 0) await new Promise(r => setTimeout(r, 900));
    startDate = await sGet(`dc:${code}:daystart`, true);
  }
  if(!startDate){ showToast('Gruppencode nicht gefunden — bitte genau prüfen'); return false; }
  const storedHash2 = await sGet(`dc:${code}:pwhash`, true);
  if(storedHash2){
    if(!groupPw){ showToast('Diese Gruppe ist passwortgeschützt'); return false; }
    if(await sha256(groupPw+code) !== storedHash2){ showToast('Falsches Passwort'); return false; }
  }
  const loginL = await loginOrCreateMember(code, name, personalPw);
  if(loginL.error){ showToast(loginL.error); return false; }
  identity = {code, playerId:loginL.playerId, playerName:name, joinedDay: computeDayCycle(startDate).day, remote:false};
  await sSet('my-identity', identity, false);
  await boot();
  return true;
}

async function leaveGroup(){
  if(identity){
    const storageCode = identity.remote ? identity.code.slice(2) : identity.code;
    await sDelete(`dc:${storageCode}:member:${identity.playerId}`, true);
  }
  teardownSupabaseRealtime();
  await sSet('my-identity', null, false);
  identity = null; S = null; remoteBlobId = null; remoteDoc = {};
  renderOnboarding();
}

async function processWeeklyTitles(code, day, players){
  const weekNum = Math.floor((day - 1) / 7) + 1;
  const processedKey = `dc:${code}:weekprocessed`;
  const processed = (await sGet(processedKey, true)) || 0;
  if(weekNum - 1 <= processed) return; // nothing new to close out
  if(players.length < 2) { await sSet(processedKey, weekNum - 1, true); return; }

  const withXp = players.filter(p => p.weeklyXp > 0);
  const ranking = [...players].sort((a,b) => b.weeklyXp - a.weeklyXp)
    .map((p,i) => `${i+1}. ${p.emoji} ${esc(p.name)} — ${p.weeklyXp} XP`).join(' · ');
  if(withXp.length >= 2){
    const sorted = [...withXp].sort((a,b) => b.weeklyXp - a.weeklyXp);
    const best = sorted[0], worst = sorted[sorted.length - 1];
    if(best.id !== worst.id){
      await sSet(`dc:${code}:title:${best.id}`, {label:'👑 Champion der Woche', emoji:'👑'}, true);
      await sSet(`dc:${code}:title:${worst.id}`, {label:'🐌 Schlusslicht', emoji:'🐌'}, true);
      await sSet(`dc:${code}:punishment:${weekNum}`, {targetId: worst.id}, true);
      for(const p of players){
        if(p.id !== best.id && p.id !== worst.id){
          await sDelete(`dc:${code}:title:${p.id}`, true);
        }
      }
      // Gold-Kiste für den Wochen-Champion
      const gold = rollGoldChest();
      const goldChanges = {xp: best.xp + (gold.xpBonus||0), weeklyXp: best.weeklyXp + (gold.xpBonus||0)};
      if(gold.newEmoji) goldChanges.emoji = gold.newEmoji;
      if(gold.shopDiscountPct) goldChanges.shopDiscountPct = gold.shopDiscountPct;
      if(gold.freeJoker) goldChanges.freeJokers = (best.freeJokers||0) + (gold.freeJokerCount||1);
      goldChanges.chestLog = appendChestHistory(best, 'gold', gold.label, day);
      await sSet(`dc:${code}:member:${best.id}`, memberPayload(best, goldChanges), true);
      await pushLogRaw(code, day, `📊 Wochenrückblick — ${ranking}<br>${best.emoji} <b>${esc(best.name)}</b> war Champion der Woche und bekommt eine 🥇 Goldkiste: ${gold.label}. ${worst.emoji} <b>${esc(worst.name)}</b> ist Schlusslicht — die Gruppe stimmt jetzt über eine Strafe fürs echte Leben ab.`);
      if(players.length > 0){
        sendPushNotification({
          title: '📊 Wochenrückblick',
          body: `Champion: ${best.name} 👑 · Schlusslicht: ${worst.name} 🐌`
        });
      }
    }
  } else if(players.length >= 2){
    await pushLogRaw(code, day, `📊 Wochenrückblick — ${ranking}`);
  }
  for(const p of players){
    await sSet(`dc:${code}:member:${p.id}`, memberPayload(p, {weeklyXp:0, streakFreezes:1}), true);
  }
  await sSet(processedKey, weekNum - 1, true);
}

let loadStateInFlight = null;
let identityInvalidated = false; // wird in loadStateImpl() gesetzt, wenn die lokale Identität kein DB-Mitglied mehr ist
async function loadState(){
  // Poll und Realtime können sich theoretisch überschneiden — ohne das hier
  // könnten dann z.B. zwei Durchläufe gleichzeitig "ensureMyAssignment"
  // auslösen und sich gegenseitig überschreiben. Läuft schon einer, hängt
  // sich jeder weitere Aufruf einfach an dessen Ergebnis statt neu zu starten.
  if(loadStateInFlight) return loadStateInFlight;
  loadStateInFlight = loadStateImpl();
  try{ await loadStateInFlight; }
  finally{ loadStateInFlight = null; }
}
async function loadStateImpl(){
  const displayCode = identity.code, me = identity.playerId;
  if(isRemote() && !isSupabase()){
    try{ await remoteFetch(); }
    catch(e){ console.error('remote fetch failed', e); showToast('Cloud-Speicher gerade nicht erreichbar'); return; }
  }
  const code = isRemote() ? remoteBlobId : displayCode;

  // Runde 1: alles abfragen, was voneinander unabhängig ist — parallel, und
  // Key+Wert in je EINEM Request statt "Keys listen, dann jeden Wert einzeln
  // holen" (N+1-Problem). Für den Chat werden Sortierung+Limit (letzte 12)
  // direkt in der Datenbank gemacht statt im Browser.
  const [startDateRaw, memberRows, poolRows, reviewRows, logRows] = await Promise.all([
    sGet(`dc:${code}:daystart`, true),
    sListGet(`dc:${code}:member:`, true),
    sListGet(`dc:${code}:pool:`, true),
    sListGet(`dc:${code}:review:`, true),
    sListGetLatest(`dc:${code}:log:`, 12, true),
  ]);
  const startDate = startDateRaw || localDateStr(new Date());
  const {day, cycle} = computeDayCycle(startDate);
  setLoadProgress(35);

  const lastSeenKey = `dc:${code}:lastseenday`;
  const lastSeen = await sGet(lastSeenKey, false);
  if(lastSeen !== day){
    if(lastSeen !== null && day > lastSeen){
      await pushLogRaw(code, day, `— Tag ${day} beginnt${cycle !== Math.floor((lastSeen-1)/2)+1 ? ` (neuer Zyklus ${cycle}, Erstell-Slots erneuert)` : ''} —`);
    }
    await sSet(lastSeenKey, day, false);
  }

  let players = memberRows.map(r => ({id: suffix(r.key, `dc:${code}:member:`), ...r.value}));
  const pool = poolRows.map(r => ({id: suffix(r.key, `dc:${code}:pool:`), ...r.value}));
  const reviews = reviewRows.map(r => ({id: suffix(r.key, `dc:${code}:review:`), ...r.value}));

  // Einmaliger XP-Bonus: alle beim Umstieg auf "100 Start-XP" bereits
  // bestehenden Mitglieder bekommen nachträglich 100 XP gutgeschrieben.
  // Flag verhindert, dass das bei jedem Reload erneut passiert.
  const xp100FlagKey = `dc:${code}:migration:xp100bonus`;
  if(players.length && !(await sGet(xp100FlagKey, true))){
    const updated = players.map(p => ({...p, xp: (p.xp||0) + 100}));
    await batchSet(updated.map(p => [`dc:${code}:member:${p.id}`, memberPayload(p, {xp: p.xp})]), true);
    await sSet(xp100FlagKey, true, true);
    players = updated;
  }

  const todayAssignRows = await sListGet(`dc:${code}:assign:${day}:`, true);
  setLoadProgress(60);

  // muss NACH den Mitgliedern und VOR dem Title-Reload laufen (kann neue
  // Titel/eine Strafe schreiben, die wir gleich danach mit lesen wollen)
  await processWeeklyTitles(code, day, players);

  const weekNum = Math.floor((day - 1) / 7) + 1;
  const [titleRows, punishInfo] = await Promise.all([
    sListGet(`dc:${code}:title:`, true),
    sGet(`dc:${code}:punishment:${weekNum}`, true),
  ]);
  const titles = {};
  titleRows.forEach(r => { titles[suffix(r.key, `dc:${code}:title:`)] = r.value; });
  players.forEach(p => { p.title = titles[p.id] || null; });
  setLoadProgress(78);

  let punishment = null;
  if(punishInfo){
    const propRows = await sListGet(`dc:${code}:punishprop:${weekNum}:`, true);
    const proposals = propRows.map(r => ({id: suffix(r.key, `dc:${code}:punishprop:${weekNum}:`), ...r.value}));
    const votes = {};
    proposals.forEach(p => { votes[p.id] = []; });
    if(proposals.length){
      const voteRows = await sListGetMulti(proposals.map(p => `dc:${code}:punishvote:${weekNum}:${p.id}:`), true);
      const pfx = `dc:${code}:punishvote:${weekNum}:`;
      voteRows.forEach(r => {
        const rest = r.key.slice(pfx.length);
        const sep = rest.indexOf(':');
        const pid = rest.slice(0, sep), voterId = rest.slice(sep+1);
        if(votes[pid]) votes[pid].push(voterId);
      });
    }
    punishment = {weekNum, targetId: punishInfo.targetId, proposals, votes};
  }

  const todayAssignments = {};
  todayAssignRows.forEach(r => { todayAssignments[suffix(r.key, `dc:${code}:assign:${day}:`)] = r.value; });

  const votingPids = Object.entries(todayAssignments).filter(([,a]) => a.status==='voting').map(([pid]) => pid);
  if(votingPids.length){
    const voteRows = await sListGetMulti(votingPids.map(pid => `dc:${code}:vote:${day}:${pid}:`), true);
    votingPids.forEach(pid => { todayAssignments[pid].votes = {}; });
    const pfx = `dc:${code}:vote:${day}:`;
    voteRows.forEach(r => {
      const rest = r.key.slice(pfx.length);
      const sep = rest.indexOf(':');
      const pid = rest.slice(0, sep), voterId = rest.slice(sep+1);
      if(todayAssignments[pid]) todayAssignments[pid].votes[voterId] = r.value;
    });
  }

  const logIds = logRows.map(r => suffix(r.key, `dc:${code}:log:`));
  const reactionsByLog = {};
  logIds.forEach(id => { reactionsByLog[id] = {}; });
  if(logIds.length){
    const reactionRows = await sListGetMulti(logIds.map(id => `dc:${code}:reaction:${id}:`), true);
    const pfx = `dc:${code}:reaction:`;
    reactionRows.forEach(r => {
      const rest = r.key.slice(pfx.length);
      const sep = rest.indexOf(':');
      const id = rest.slice(0, sep), pid = rest.slice(sep+1);
      if(reactionsByLog[id]) reactionsByLog[id][pid] = r.value;
    });
  }
  const log = logRows.map(r => { const id = suffix(r.key, `dc:${code}:log:`); return {...r.value, id, reactions: reactionsByLog[id] || {}}; });
  setLoadProgress(94);

  // Anmeldung gegen die Datenbank verifizieren: nur wer hier wirklich noch als
  // Mitglied existiert, gilt als angemeldet. Die lokal gespeicherte Identität
  // allein reicht nicht mehr — ohne diese Prüfung würde ein Gerät mit einer
  // veralteten/ungültigen Identität weiter täglich Aufgaben für einen
  // "Geister"-Account bekommen, der es laut Datenbank gar nicht mehr gibt.
  if(!players.some(p => p.id === me)){
    console.warn('Lokale Identität ist kein gültiges Mitglied mehr — Abmeldung.');
    identityInvalidated = true;
    await sSet('my-identity', null, false);
    identity = null; S = null;
    teardownSupabaseRealtime();
    renderOnboarding();
    showToast('Du wurdest abgemeldet — bitte erneut anmelden');
    return;
  }

  S = {code, displayCode, day, cycle, players, pool, reviews, todayAssignments, log, punishment};

  await ensureMyAssignment();
  await claimDailyLoginBonus();
  await processMissedPenalties();
  await checkAndFinalizeMyVotes();
  await checkMyDuels();
}

/* ---------------- daily login bonus: Holzkiste (unabhängig von der Aufgabe) ---------------- */

async function claimDailyLoginBonus(){
  const me = identity.playerId;
  const meRec = getMe();
  if(!meRec || (meRec.lastLoginBonusDay||0) >= S.day) return;
  const reward = rollWoodChest();
  const changes = {lastLoginBonusDay:S.day};
  if(reward.xpBonus){ changes.xp = meRec.xp + reward.xpBonus; changes.weeklyXp = meRec.weeklyXp + reward.xpBonus; }
  if(reward.freeJoker){ changes.freeJokers = (meRec.freeJokers||0) + 1; }
  changes.chestLog = appendChestHistory(meRec, 'wood', reward.label);
  await sSet(`dc:${S.code}:member:${me}`, memberPayload(meRec, changes), true);
  Object.assign(meRec, changes);
  showChestModal({kind:'wood', title:'Tägliche Holzkiste', rewardLabel: reward.label});
}

/* ---------------- streak milestones ---------------- */

const STREAK_MILESTONES = [7, 30, 100];
async function celebrateMilestoneIfNeeded(meRec, newStreak){
  const isHundredPlus = newStreak >= 100 && newStreak % 100 === 0;
  if(!STREAK_MILESTONES.includes(newStreak) && !isHundredPlus) return;
  showConfetti();
  await pushLog(`🔥 <b>${esc(meRec.name)}</b> hat einen <b>${newStreak}-Tage-Streak</b> erreicht! Respekt.`, 'milestone');
  if(otherPlayers().length > 0){
    sendPushNotification({
      excludePlayerId: identity.playerId,
      title: '🔥 Streak-Meilenstein!',
      body: `${meRec.name} hat ${newStreak} Tage in Folge geschafft!`
    });
  }
}

const BONUS_EMOJIS = ['🦄','🐲','🦊','🐸','🦁','🐨','🐯','🦉','🐺','🦋','🐙','🦖'];

function rollWoodChest(){
  const roll = Math.random();
  if(roll < 0.85){
    const amt = 8 + Math.floor(Math.random()*13); // 8-20 XP
    return {xpBonus:amt, label:`+${amt} XP`};
  }
  return {freeJoker:true, label:`🃏 Gratis-Joker`};
}

function rollSilverChest(){
  const roll = Math.random();
  if(roll < 0.45){
    const amt = 20 + Math.floor(Math.random()*31); // 20-50 XP
    return {xpBonus:amt, label:`+${amt} XP`};
  } else if(roll < 0.65){
    const emoji = BONUS_EMOJIS[Math.floor(Math.random()*BONUS_EMOJIS.length)];
    return {newEmoji:emoji, label:`neues Emoji ${emoji}`};
  } else if(roll < 0.85){
    return {shopDiscountPct:30, label:`🏷️ 30% Rabatt aufs nächste Design`};
  }
  return {freeJoker:true, label:`🃏 Gratis-Joker`};
}

// Gold-Kiste: Belohnung für Duell-Siege & Wochen-Champion — die beste Stufe
function rollGoldChest(){
  const roll = Math.random();
  if(roll < 0.4){
    const amt = 30 + Math.floor(Math.random()*41); // 30-70 XP
    return {xpBonus:amt, label:`+${amt} XP`};
  } else if(roll < 0.6){
    const emoji = BONUS_EMOJIS[Math.floor(Math.random()*BONUS_EMOJIS.length)];
    return {newEmoji:emoji, label:`neues Emoji ${emoji}`};
  } else if(roll < 0.8){
    return {shopDiscountPct:50, label:`🏷️ 50% Rabatt aufs nächste Design`};
  }
  return {freeJoker:true, freeJokerCount:2, label:`🃏 2× Gratis-Joker`};
}

function getMe(){ return S.players.find(p => p.id === identity.playerId); }
function otherPlayers(){ return S.players.filter(p => p.id !== identity.playerId); }

/* ---------------- task selection ---------------- */

function pickTaskForMe(lastTask){
  const fresh = S.pool.filter(t => t.status === 'active' && t.cycle === S.cycle);
  let candidates = fresh;
  if(lastTask){
    candidates = fresh.filter(t => t.id !== lastTask.poolTaskId && t.category !== lastTask.category);
    if(candidates.length === 0) candidates = fresh.filter(t => t.id !== lastTask.poolTaskId);
    if(candidates.length === 0) candidates = fresh;
  }
  if(candidates.length > 0){
    const t = candidates[Math.floor(Math.random()*candidates.length)];
    return {source:'pool', poolTaskId:t.id, title:t.title, desc:t.desc, category:t.category, proofType:t.proofType, difficulty:t.difficulty, points:t.points, creatorName: t.creatorName || 'Unbekannt'};
  }
  const stale = S.pool.filter(t => t.status === 'active' && t.cycle < S.cycle).sort((a,b) => a.cycle - b.cycle);
  if(stale.length > 0){
    const t = stale[0];
    return {source:'fallback', poolTaskId:t.id, title:t.title, desc:t.desc, category:t.category, proofType:t.proofType, difficulty:t.difficulty, points:t.points, creatorName: t.creatorName || 'Unbekannt'};
  }
  const base = PREDEFINED[Math.floor(Math.random()*PREDEFINED.length)];
  return {source:'predefined', poolTaskId:null, title:base.title, desc:base.desc, category:base.category, proofType:base.proofType, difficulty:base.difficulty, points: DIFF[base.difficulty].points, creatorName:'System'};
}

async function ensureMyAssignment(){
  const me = identity.playerId;
  if(S.todayAssignments[me]) return; // already have one

  const prevDayKey = `dc:${S.code}:assign:${S.day - 1}:${me}`;
  const prevAssignment = S.day > 1 ? await sGet(prevDayKey, true) : null;
  const prev = prevAssignment ? prevAssignment.task : null;

  const picked = pickTaskForMe(prev);
  const assignment = {task: picked, status:'active', proof:'', result:null};
  await sSet(`dc:${S.code}:assign:${S.day}:${me}`, assignment, true);

  if(picked.poolTaskId){
    await sSet(`dc:${S.code}:pool:${picked.poolTaskId}`, {...S.pool.find(t=>t.id===picked.poolTaskId), status:'assigned'}, true);
  }
  S.todayAssignments[me] = assignment;
}

/* ---------------- missed penalty (self-applied) ---------------- */

async function processMissedPenalties(){
  const me = identity.playerId;
  const trackerKey = `dc:${S.code}:mytracker`;
  const defaultCheckedUpTo = Math.max((identity.joinedDay || 1) - 1, 0);
  const tracker = (await sGet(trackerKey, false)) || {checkedUpTo: defaultCheckedUpTo};
  let from = Math.max(tracker.checkedUpTo + 1, 1);
  const to = S.day - 1;
  if(from > to){ return; }
  let penalty = 0; let missedCount = 0; let protectedCount = 0; let frozenCount = 0;
  let freezesLeft = (getMe()?.streakFreezes ?? 1);
  for(let d = from; d <= to && d <= from + 60; d++){
    const key = `dc:${S.code}:assign:${d}:${me}`;
    const a = await sGet(key, true);
    const shielded = !!(await sGet(`dc:${S.code}:shield:${d}:${me}`, true));
    if(a && a.status === 'active'){
      if(shielded){
        await sSet(key, {...a, status:'resolved', result:'protected'}, true);
        protectedCount++;
      } else if(freezesLeft > 0){
        // kostenlose, automatische Streak-Rettung (1x pro Woche) — rettet nur
        // den Streak, kein XP für den Tag, kein zusätzlicher Minuspunkt
        freezesLeft--;
        await sSet(key, {...a, status:'resolved', result:'frozen'}, true);
        frozenCount++;
      } else {
        // had a task that day, never even submitted it
        await sSet(key, {...a, status:'resolved', result:'missed'}, true);
        penalty += MISS_PENALTY; missedCount++;
      }
    } else if(a && a.status === 'voting'){
      // Wurde eingereicht, aber nie fertig abgestimmt (z.B. zu wenige Mitspieler
      // an dem Tag) — der Tag ist vorbei, also jetzt mit den bis dahin
      // eingegangenen Stimmen final auswerten, statt für immer in
      // "Abstimmung läuft" hängen zu bleiben. Zählt NICHT als "nicht versucht",
      // da die Aufgabe ja eingereicht wurde.
      const votes = a.votes || {};
      const yes = Object.values(votes).filter(v=>v==='yes').length;
      const no = Object.values(votes).filter(v=>v==='no').length;
      const passed = yes > no;
      await sSet(key, {...a, status:'resolved', result: passed ? 'completed' : 'failed'}, true);
      if(passed){
        const meRecNow = getMe();
        const gained = a.task.points;
        const newStreak = (meRecNow.streak||0) + 1;
        const newBest = Math.max(meRecNow.bestStreak||0, newStreak);
        const silver = rollSilverChest();
        const changes = {xp: meRecNow.xp + gained + (silver.xpBonus||0), weeklyXp: meRecNow.weeklyXp + gained + (silver.xpBonus||0), streak:newStreak, bestStreak:newBest};
        if(silver.newEmoji) changes.emoji = silver.newEmoji;
        if(silver.shopDiscountPct) changes.shopDiscountPct = silver.shopDiscountPct;
        if(silver.freeJoker) changes.freeJokers = (meRecNow.freeJokers||0) + (silver.freeJokerCount||1);
        changes.chestLog = appendChestHistory(meRecNow, 'silver', silver.label);
        await sSet(`dc:${S.code}:member:${me}`, memberPayload(meRecNow, changes), true);
        Object.assign(meRecNow, changes);
        showToast(`🥈 Silberkiste: ${silver.label}`);
        await pushLog(`${meRecNow.emoji} <b>${esc(meRecNow.name)}</b> hat eine 🥈 Silberkiste bekommen: ${silver.label}`);
        await celebrateMilestoneIfNeeded(meRecNow, newStreak);
      }
    } else if(!a){
      // never opened the app that day, so no task was ever picked up —
      // still counts as a missed day, same as everyone else
      let result = 'missed';
      if(shielded){ result = 'protected'; protectedCount++; }
      else if(freezesLeft > 0){ freezesLeft--; result = 'frozen'; frozenCount++; }
      else { penalty += MISS_PENALTY; missedCount++; }
      await sSet(key, {
        task:{title:'(keine Aufgabe abgeholt)', desc:'', category:'—', proofType:'none', difficulty:null, points:0},
        status:'resolved', result
      }, true);
    }
    // status 'resolved' bereits erledigt — unberührt lassen
  }
  if(missedCount > 0 || frozenCount > 0){
    const meRec = getMe();
    const changes = {xp: meRec.xp + penalty, weeklyXp: meRec.weeklyXp + penalty};
    if(missedCount > 0) changes.streak = 0; // nur echte Fehltage brechen den Streak
    if(frozenCount > 0) changes.streakFreezes = freezesLeft;
    await sSet(`dc:${S.code}:member:${me}`, memberPayload(meRec, changes), true);
    Object.assign(meRec, changes);
    let msg = '';
    if(missedCount > 0) msg += `${missedCount} Aufgabe(n) nicht versucht. ${penalty} XP. `;
    if(frozenCount > 0) msg += `❄️ ${frozenCount}× automatische Streak-Rettung eingesetzt — kein Streak-Verlust!`;
    await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> ${msg}`);
  }
  await sSet(trackerKey, {checkedUpTo: to}, false);
}

/* ---------------- creation ---------------- */

async function createTask(data){
  const me = identity.playerId;
  const meRec = getMe();
  const others = otherPlayers();
  if(others.length === 0){ showToast('Lade zuerst Freunde in die Gruppe ein'); return; }
  const reviewer = others[Math.floor(Math.random()*others.length)];
  const id = genId();
  const review = {
    task: {title:data.title, desc:data.desc, category:data.category, proofType:data.proofType},
    creatorId: me, creatorName: meRec.name, reviewerId: reviewer.id,
    status:'pending', creationCycle: S.cycle
  };
  await sSet(`dc:${S.code}:review:${id}`, review, true);
  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat eine neue Aufgabe zur Prüfung eingereicht.`);
  sendPushNotification({
    onlyPlayerIds: [reviewer.id],
    title: '🔍 Bitte etwas prüfen',
    body: `${meRec.name} hat eine neue Aufgabe eingereicht — du bist dran.`
  });
}

async function resolveReview(reviewId, accepted, difficulty, reason){
  const rv = S.reviews.find(r => r.id === reviewId);
  if(!rv || rv.status !== 'pending') return; // already resolved — guards against double-processing
  const creator = S.players.find(p => p.id === rv.creatorId);
  const logKey = `dc:${S.code}:log:${Date.now()}-${genId()}`;
  if(accepted){
    const poolId = 'from-' + reviewId; // deterministic, not random — a second accidental accept overwrites instead of duplicating
    await batchSet([
      [`dc:${S.code}:pool:${poolId}`, {
        title: rv.task.title, desc: rv.task.desc, category: rv.task.category, proofType: rv.task.proofType,
        difficulty, points: DIFF[difficulty].points, status:'active', cycle: S.cycle,
        creatorName: creator ? creator.name : 'Unbekannt'
      }],
      [`dc:${S.code}:review:${reviewId}`, {...rv, status:'accepted', difficulty}],
      [logKey, {day: S.day, text: `Eine Aufgabe von <b>${creator ? esc(creator.name) : '?'}</b> wurde angenommen (${DIFF[difficulty].label}) und kam in den Pool.`, type:'system'}]
    ], true);
  } else {
    await batchSet([
      [`dc:${S.code}:review:${reviewId}`, {...rv, status:'rejected', reason}],
      [logKey, {day: S.day, text: `Eine Aufgabe von <b>${creator ? esc(creator.name) : '?'}</b> wurde abgelehnt (${esc(reason)}).`, type:'system'}]
    ], true);
  }
}

/* ---------------- completion & voting ---------------- */

async function submitProof(proofText){
  const me = identity.playerId;
  const a = S.todayAssignments[me];
  if(!a || a.status !== 'active') return;
  const updated = {...a, proof: proofText || '', status:'voting'};
  await sSet(`dc:${S.code}:assign:${S.day}:${me}`, updated, true);
  S.todayAssignments[me] = updated;
  const meRec = getMe();
  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat „${esc(a.task.title)}" eingereicht. Die Gruppe stimmt jetzt ab.`, 'proof', meRec.id || identity.playerId);
  if(otherPlayers().length > 0){
    sendPushNotification({
      excludePlayerId: me,
      title: '🗳️ Abstimmung nötig',
      body: `${meRec.name} hat „${a.task.title}" eingereicht — jetzt abstimmen.`
    });
  }
}

async function castVote(assigneeId, vote){
  const me = identity.playerId;
  await sSet(`dc:${S.code}:vote:${S.day}:${assigneeId}:${me}`, vote, true);
  const meRec = getMe();
  const target = S.players.find(p => p.id === assigneeId);
  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat bei ${target ? esc(target.name) : '?'}s Aufgabe mit ${vote==='yes' ? '✅ Ja' : '❌ Nein'} abgestimmt.`);
  showToast(vote === 'yes' ? 'Mit Ja gestimmt' : 'Mit Nein gestimmt');
}

async function checkAndFinalizeMyVotes(){
  const me = identity.playerId;
  const myAssign = S.todayAssignments[me];
  if(!myAssign || myAssign.status !== 'voting') return;
  const votes = myAssign.votes || {};
  const needed = otherPlayers().length;
  const collected = Object.keys(votes).length;
  if(needed > 0 && collected >= needed){
    const yes = Object.values(votes).filter(v=>v==='yes').length;
    const no = Object.values(votes).filter(v=>v==='no').length;
    const passed = yes > no;
    const result = passed ? 'completed' : 'failed';
    const finalAssign = {...myAssign, status:'resolved', result};
    await sSet(`dc:${S.code}:assign:${S.day}:${me}`, finalAssign, true);
    S.todayAssignments[me] = finalAssign;
    const meRec = getMe();
    const gained = passed ? myAssign.task.points : 0;
    const newStreak = passed ? (meRec.streak||0) + 1 : 0;
    const newBest = Math.max(meRec.bestStreak||0, newStreak);
    const silver = passed ? rollSilverChest() : null;
    const changes = {xp: meRec.xp + gained + (silver?.xpBonus||0), weeklyXp: meRec.weeklyXp + gained + (silver?.xpBonus||0), streak:newStreak, bestStreak:newBest};
    if(silver?.newEmoji) changes.emoji = silver.newEmoji;
    if(silver?.shopDiscountPct) changes.shopDiscountPct = silver.shopDiscountPct;
    if(silver?.freeJoker) changes.freeJokers = (meRec.freeJokers||0) + (silver.freeJokerCount||1);
    if(silver) changes.chestLog = appendChestHistory(meRec, 'silver', silver.label);
    await sSet(`dc:${S.code}:member:${me}`, memberPayload(meRec, changes), true);
    Object.assign(meRec, changes);
    await pushLog(passed
      ? `${meRec.emoji} <b>${esc(meRec.name)}</b>s Aufgabe wurde bestätigt (${yes} Ja / ${no} Nein). +${gained} XP.${newStreak>1 ? ` 🔥 ${newStreak} Tage in Folge.` : ''}`
      : `${meRec.emoji} <b>${esc(meRec.name)}</b>s Aufgabe wurde abgelehnt (${yes} Ja / ${no} Nein). 0 XP.`);
    if(silver){
      await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat eine 🥈 Silberkiste bekommen: ${silver.label}`);
      showChestModal({kind:'silver', title:'Silberkiste', rewardLabel: silver.label});
    }
    if(passed) await celebrateMilestoneIfNeeded(meRec, newStreak);
    await checkMyDuels();
  }
}

/* ---------------- derived helpers ---------------- */

function slotsUsedThisCycle(){
  const me = identity.playerId;
  return S.reviews.filter(r => r.creatorId === me && r.creationCycle === S.cycle && r.status !== 'rejected').length;
}
function myPendingReviews(){ return S.reviews.filter(r => r.reviewerId === identity.playerId && r.status === 'pending'); }
function myPendingCreations(){ return S.reviews.filter(r => r.creatorId === identity.playerId && r.status === 'pending'); }
function pendingVotesForMe(){
  const me = identity.playerId;
  const out = [];
  for(const [pid, a] of Object.entries(S.todayAssignments)){
    if(pid === me) continue;
    if(a.status === 'voting'){
      out.push({playerId: pid, assignment: a});
    }
  }
  return out;
}

/* ================= RENDERING ================= */

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function esc(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function proofLabel(pt){ return (PROOF_TYPES.find(p=>p[0]===pt)||[,pt])[1]; }
function stampHtml(difficulty){
  if(!difficulty) return '';
  const d = DIFF[difficulty];
  return `<div class="stamp ${difficulty}"><div class="p">${d.points}</div><div class="d">${d.label}</div></div>`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

function renderAuthGate(){
  document.getElementById('obBody').innerHTML = `
    <div class="onboard-sub">Melde dich an, um deine Gruppen geräteübergreifend zu sehen.</div>

    </div>

    <div style="display:flex; align-items:center; gap:10px; margin:16px 0;">
      <div style="flex:1; height:1px; background:var(--paper-edge);"></div>
      <span class="hint" style="margin:0;">oder</span>
      <div style="flex:1; height:1px; background:var(--paper-edge);"></div>
    </div>
    <button class="btn btn-ghost" id="authGoogleBtn">🔵 Mit Google anmelden</button>
  `;
  const hint = document.getElementById('authHint');
  const emailEl = document.getElementById('authEmail');
  const pwEl = document.getElementById('authPw');
  const loginBtn = document.getElementById('authLoginBtn');
  const signupBtn = document.getElementById('authSignupBtn');
  const googleBtn = document.getElementById('authGoogleBtn');
  emailEl.focus();

  document.getElementById('authPwToggle').onclick = (e) => {
    e.preventDefault();
    const show = pwEl.type === 'password';
    pwEl.type = show ? 'text' : 'password';
    e.currentTarget.textContent = show ? '🙈' : '👁️';
  };

  function setHint(msg, kind){
    hint.textContent = msg || '';
    hint.style.color = kind === 'error' ? 'var(--danger)' : (kind === 'ok' ? 'var(--success)' : '');
  }
  function setBusy(busy){
    [loginBtn, signupBtn, googleBtn].forEach(b => b.disabled = busy);
  }
  function readInputs(){
    const email = emailEl.value.trim();
    const pw = pwEl.value;
    if(!email || !pw){ setHint('Bitte E-Mail und Passwort eingeben.', 'error'); return null; }
    if(!isValidEmail(email)){ setHint('Das sieht nicht nach einer gültigen E-Mail aus.', 'error'); return null; }
    return {email, pw};
  }

  loginBtn.onclick = async () => {
    const input = readInputs();
    if(!input) return;
    setBusy(true); setHint('Melde an…');
    const { error } = await authSignIn(input.email, input.pw);
    setBusy(false);
    if(error){ setHint(error.message === 'Invalid login credentials' ? 'E-Mail oder Passwort falsch.' : error.message, 'error'); return; }
    await renderEntryScreen();
  };
  signupBtn.onclick = async () => {
    const input = readInputs();
    if(!input) return;
    if(input.pw.length < 6){ setHint('Passwort muss mind. 6 Zeichen haben.', 'error'); return; }
    setBusy(true); setHint('Erstelle Konto…');
    const { data, error } = await authSignUp(input.email, input.pw);
    setBusy(false);
    if(error){ setHint(error.message, 'error'); return; }
    // Supabase gibt bei bereits existierender, bestätigter E-Mail aus Sicherheitsgründen
    // keinen Fehler zurück, sondern user.identities: [] — das fangen wir hier ab.
    if(data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0){
      setHint('Für diese E-Mail existiert bereits ein Konto. Nutze „Anmelden" oder „Passwort vergessen".', 'error');
      return;
    }
    if(data.session){ await renderEntryScreen(); }
    else { setHint('📧 Bestätigungslink an deine E-Mail geschickt — bitte dort bestätigen und dann hier anmelden.', 'ok'); }
  };
  document.getElementById('authForgotBtn').onclick = async () => {
    const email = emailEl.value.trim();
    if(!email || !isValidEmail(email)){ setHint('Trag oben erst deine E-Mail-Adresse ein.', 'error'); emailEl.focus(); return; }
    setBusy(true); setHint('Sende Link…');
    const sb = getSb();
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href });
    setBusy(false);
    if(error){ setHint(error.message, 'error'); return; }
    setHint('📧 Link zum Zurücksetzen wurde geschickt (falls ein Konto existiert).', 'ok');
  };
  googleBtn.onclick = async () => {
    setBusy(true); setHint('Leite zu Google weiter…');
    const { error } = await authSignInGoogle();
    if(error){ setBusy(false); setHint('Google-Anmeldung ist für diese App noch nicht eingerichtet.', 'error'); }
  };
  pwEl.addEventListener('keydown', (e) => { if(e.key === 'Enter') loginBtn.click(); });
}

// WICHTIG: diese Funktionen laufen, BEVOR "identity" gesetzt ist — darum NIE die
// generischen sGet/sSet-Wrapper benutzen (die hängen an isSupabase()/identity.backend
// und würden still auf localStorage statt auf die echte Cloud-DB ausweichen).
// Hier wird direkt mit sbRow* gegen den übergebenen Code gesprochen.
async function createGroupWithAccount(name, groupPw, userId){
  if(!hasSupabase()){ showToast('Dafür wird eine Cloud-Verbindung gebraucht'); return; }
  const startDate = localDateStr(new Date());
  const code = genCode();
  const okDay = await sbRowSet(code, `dc:${code}:daystart`, startDate);
  if(!okDay){ showToast('Gruppe konnte nicht angelegt werden — Verbindung prüfen und nochmal versuchen'); return; }
  if(groupPw) await sbRowSet(code, `dc:${code}:pwhash`, await sha256(groupPw+code));
  const playerId = 'p_' + genId();
  const emoji = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  await sbRowSet(code, `dc:${code}:member:${playerId}`, memberPayload({name, emoji}, {}));
  // Verifizieren statt blind vertrauen: erst wenn der Datensatz wirklich da ist,
  // wird die Mitgliedschaft verknüpft — sonst bleibt "Meine Gruppen" sauber.
  const verify = await sbRowGet(code, `dc:${code}:member:${playerId}`);
  if(!verify){ showToast('Gruppe konnte nicht angelegt werden — bitte nochmal versuchen'); return; }
  await upsertMembership({userId, code:'S-'+code, playerId, name, emoji});
  remoteBlobId = code;
  identity = {code:'S-'+code, playerId, playerName:name, joinedDay:1, remote:true, backend:'supabase'};
  await sSet('my-identity', identity, false);
  await boot();
}

async function joinGroupWithAccount(codeRaw, name, groupPw, userId){
  if(!hasSupabase()){ showToast('Dafür wird eine Cloud-Verbindung gebraucht'); return false; }
  let code = codeRaw.trim();
  if(code.toUpperCase().startsWith('S-')) code = code.slice(2);
  const expectedHash = await sbRowGet(code, `dc:${code}:pwhash`);
  if(expectedHash){
    const givenHash = groupPw ? await sha256(groupPw+code) : null;
    if(givenHash !== expectedHash) return false;
  }
  const memberRows = await sbRowListWithValues(code, `dc:${code}:member:`);
  if(!memberRows){ return false; }
  const nameLower = name.trim().toLowerCase();
  const existing = memberRows.find(r => r.value && r.value.name && r.value.name.trim().toLowerCase() === nameLower);
  let playerId, emoji;
  if(existing){
    playerId = suffix(existing.key, `dc:${code}:member:`); emoji = existing.value.emoji;
  } else {
    playerId = 'p_' + genId();
    emoji = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
    await sbRowSet(code, `dc:${code}:member:${playerId}`, memberPayload({name, emoji}, {}));
  }
  // Verifizieren statt blind vertrauen: erst wenn der Datensatz wirklich da ist,
  // wird die Mitgliedschaft verknüpft — sonst bleibt "Meine Gruppen" sauber.
  const verify = await sbRowGet(code, `dc:${code}:member:${playerId}`);
  if(!verify) return false;
  await upsertMembership({userId, code:'S-'+code, playerId, name, emoji});
  remoteBlobId = code;
  identity = {code:'S-'+code, playerId, playerName:name, joinedDay: 1, remote:true, backend:'supabase'};
  await sSet('my-identity', identity, false);
  await boot();
  return true;
}

// Bestehendes (lokales Passwort-)Profil zusätzlich mit dem Konto verknüpfen —

}

function setTab(tab){
  if(currentTab === 'create' && tab !== 'create') createFormDirty = false;
  if(currentTab === 'review' && tab !== 'review') reviewFormDirty = false;
  if(currentTab === 'dashboard' && tab !== 'dashboard') chatInputDirty = false;
  currentTab = tab;
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  if(S) renderActivePanel();
}

async function challengeDuel(opponentId){
  if(!S) return;
  const day = S.day;
  const keys = await sList(`dc:${S.code}:duel:`, true);
  for(const k of keys){
    const v = await sGet(k, true);
    if(v && v.day === day && ((v.a===identity.playerId && v.b===opponentId) || (v.a===opponentId && v.b===identity.playerId))){
      showToast('Ihr habt heute schon ein Duell');
      return;
    }
  }
  const id = genId();
  await sSet(`dc:${S.code}:duel:${id}`, {a:identity.playerId, b:opponentId, day, status:'active', winner:null}, true);
  const opp = S.players.find(p=>p.id===opponentId);
  await pushLog(`⚔️ Duell gestartet zwischen dir und ${opp?esc(opp.name):'?'} für heute — Belohnung geht an, wer die Aufgabe schafft und der andere nicht.`);
  showToast('Duell gestartet ⚔️');
}

async function checkMyDuels(){
  if(!S) return;
  const DUEL_BONUS = 15;
  const keys = await sList(`dc:${S.code}:duel:`, true);
  for(const k of keys){
    const v = await sGet(k, true);
    if(!v || v.status !== 'active') continue;
    if(v.a !== identity.playerId && v.b !== identity.playerId) continue;
    const otherId = v.a === identity.playerId ? v.b : v.a;
    const myAssign = await sGet(`dc:${S.code}:assign:${v.day}:${identity.playerId}`, true);
    const otherAssign = await sGet(`dc:${S.code}:assign:${v.day}:${otherId}`, true);
    if(!myAssign || !otherAssign) continue;
    if(myAssign.status !== 'resolved' || otherAssign.status !== 'resolved') continue;
    const myWon = myAssign.result === 'completed' && otherAssign.result !== 'completed';
    const otherWon = otherAssign.result === 'completed' && myAssign.result !== 'completed';
    if(myWon){
      const meRec = getMe();
      const gold = rollGoldChest();
      const changes = {xp: meRec.xp + DUEL_BONUS + (gold.xpBonus||0), weeklyXp: meRec.weeklyXp + DUEL_BONUS + (gold.xpBonus||0)};
      if(gold.newEmoji) changes.emoji = gold.newEmoji;
      if(gold.shopDiscountPct) changes.shopDiscountPct = gold.shopDiscountPct;
      if(gold.freeJoker) changes.freeJokers = (meRec.freeJokers||0) + (gold.freeJokerCount||1);
      changes.chestLog = appendChestHistory(meRec, 'gold', gold.label);
      await sSet(`dc:${S.code}:member:${identity.playerId}`, memberPayload(meRec, changes), true);
      Object.assign(meRec, changes);
      await sSet(k, {...v, status:'resolved', winner:identity.playerId}, true);
      await pushLog(`⚔️ ${meRec.emoji} <b>${esc(meRec.name)}</b> hat ein Duell gewonnen! +${DUEL_BONUS} Bonus-XP und eine 🥇 Goldkiste: ${gold.label}`);
      showChestModal({kind:'gold', title:'Goldkiste — Duell gewonnen!', rewardLabel: `+${DUEL_BONUS} XP Duell-Bonus + ${gold.label}`});
    } else if(otherWon){
      await sSet(k, {...v, status:'resolved', winner:otherId}, true);
    } else {
      await sSet(k, {...v, status:'resolved', winner:null}, true);
    }
  }
}

const LEVELS = [
  {min:0, title:'Neuling'}, {min:50, title:'Anfänger'}, {min:150, title:'Einsteiger'},
  {min:300, title:'Mitläufer'}, {min:500, title:'Geübt'}, {min:800, title:'Fortgeschritten'},
  {min:1200, title:'Profi'}, {min:1800, title:'Experte'}, {min:2500, title:'Meister'}, {min:3500, title:'Legende'}
];
function levelFor(xp){
  let lvl = 1, title = LEVELS[0].title;
  for(let i=0;i<LEVELS.length;i++){ if(xp >= LEVELS[i].min){ lvl = i+1; title = LEVELS[i].title; } }
  return {level:lvl, title};
}
