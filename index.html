function clearTourHighlight(){
  document.querySelectorAll('.tour-target').forEach(e => e.classList.remove('tour-target'));
}

function positionTour(overlay, target){
  const box = overlay.querySelector('.tour-box');
  const tip = overlay.querySelector('.tour-tip');
  if(!target){
    box.style.cssText = 'top:50%; left:50%; width:0; height:0; border:none;';
    tip.style.top = '50%'; tip.style.bottom = 'auto'; tip.style.left = '50%';
    tip.style.width = Math.min(320, window.innerWidth - 32) + 'px';
    tip.style.transform = 'translate(-50%,-50%)';
    return;
  }
  const r = target.getBoundingClientRect();
  const cs = getComputedStyle(target);
  const radius = parseFloat(cs.borderRadius) > 20 ? '50%' : '14px';
  box.style.cssText = `top:${r.top-6}px; left:${r.left-6}px; width:${r.width+12}px; height:${r.height+12}px; border-radius:${radius};`;
  const vh = window.innerHeight, vw = window.innerWidth;
  const tipWidth = Math.min(320, vw - 32);
  let left = Math.max(16 + tipWidth/2, Math.min(vw - 16 - tipWidth/2, r.left + r.width/2));
  tip.style.width = tipWidth + 'px';
  tip.style.left = left + 'px';
  if(r.top < vh - 220){
    tip.style.top = Math.min(r.bottom + 14, vh - 20) + 'px';
    tip.style.bottom = 'auto';
    tip.style.transform = 'translateX(-50%)';
  } else {
    tip.style.bottom = (vh - r.top + 14) + 'px';
    tip.style.top = 'auto';
    tip.style.transform = 'translateX(-50%)';
  }
}

async function showTourStep(overlay, idx){
  tourIndex = idx;
  const step = TOUR_STEPS[idx];
  clearTourHighlight();
  if(step.tab && step.tab !== currentTab) setTab(step.tab);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const target = step.target ? document.querySelector(step.target) : null;
  if(target){ target.classList.add('tour-target'); target.scrollIntoView({block:'center'}); }
  positionTour(overlay, target);
  requestAnimationFrame(() => positionTour(overlay, target));

  const last = idx === TOUR_STEPS.length - 1;
  overlay.querySelector('.tour-tip').innerHTML = `
    <div style="font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.4px; margin-bottom:5px;">SCHRITT ${idx+1}/${TOUR_STEPS.length}</div>
    <div style="font-weight:800; font-size:14.5px; margin-bottom:5px;">${step.title}</div>
    <div style="font-size:13px; line-height:1.5; color:var(--text-dim); margin-bottom:13px;">${step.text}</div>
    <div style="display:flex; gap:8px;">
      ${idx > 0 ? `<button class="btn btn-ghost" id="tourBack" style="flex:1; padding:9px; font-size:12.5px;">Zurück</button>`
                 : `<button class="btn btn-ghost" id="tourSkip" style="flex:1; padding:9px; font-size:12.5px;">Überspringen</button>`}
      <button class="btn btn-primary" id="tourNext" style="flex:1; padding:9px; font-size:12.5px;">${last ? 'Fertig ✓' : 'Weiter'}</button>
    </div>`;
  document.getElementById('tourNext').onclick = () => { if(last) closeTutorial(overlay); else showTourStep(overlay, idx+1); };
  if(idx > 0) document.getElementById('tourBack').onclick = () => showTourStep(overlay, idx-1);
  else document.getElementById('tourSkip').onclick = () => closeTutorial(overlay);
}

async function closeTutorial(overlay){
  clearTourHighlight();
  if(tourResizeHandler){ window.removeEventListener('resize', tourResizeHandler); tourResizeHandler = null; }
  overlay.remove();
  await sSet('tutorial-seen', true, false);
}

function openTutorial(){
  const overlay = el(`<div class="modal-overlay" id="tourOverlay" style="background:transparent; backdrop-filter:none; align-items:stretch; justify-content:stretch;"><div class="tour-box"></div><div class="tour-tip"></div></div>`);
  document.body.appendChild(overlay);
  tourResizeHandler = () => positionTour(overlay, document.querySelector('.tour-target'));
  window.addEventListener('resize', tourResizeHandler);

}

function renderThemeList(me){
  const owned = me.ownedThemes || ['plain'];
  const selected = me.selectedTheme || 'plain';
  const discountPct = me.shopDiscountPct || 0;
  const banner = discountPct > 0
    ? `<div style="background:var(--accent-2); color:#fff; font-weight:700; font-size:12.5px; border-radius:10px; padding:9px 12px; margin-bottom:10px;">🎁 Du hast ${discountPct}% Bonus-Rabatt auf das nächste Design!</div>`
    : '';
  const cards = THEMES.map(t => {
    const isOwned = owned.includes(t.id);
    const isSelected = selected === t.id;
    let action;
    if(isSelected) action = `<span class="hint" style="margin:0; font-weight:700; color:var(--accent);">Aktiv ✓</span>`;
    else if(isOwned) action = `<button class="btn btn-ghost" data-select-theme="${t.id}" style="width:auto; padding:8px 14px; font-size:12px;">Anwenden</button>`;
    else {
      let label;
      if(t.currency === 'eur') label = `${t.cost.toFixed(2)} € (Demo)`;
      else if(discountPct > 0){
        const reduced = Math.max(0, t.cost - Math.round(t.cost * discountPct / 100));
        label = `<span style="text-decoration:line-through; opacity:0.6; font-weight:500;">${t.cost}</span> ${reduced} XP 🎁`;
      } else label = `${t.cost} XP`;
      const disabled = t.currency === 'xp' && me.xp < (discountPct > 0 ? Math.max(0, t.cost - Math.round(t.cost*discountPct/100)) : t.cost);
      action = `<button class="btn btn-accent" data-buy-theme="${t.id}" style="width:auto; padding:8px 14px; font-size:12px;" ${disabled ? 'disabled title="Nicht genug XP"':''}>${label}</button>`;
    }
    return `<div class="theme-card ${isOwned && isSelected ? 'owned-active':''}">
      <div class="theme-swatch" style="background:${t.swatch};"></div>
      <div class="info"><b>${t.name}</b><span class="hint" style="margin:0;">${t.desc}</span></div>
      ${action}
    </div>`;
  }).join('');
  return banner + cards;
}

async function buyTheme(themeId){
  const theme = THEMES.find(t => t.id === themeId);
  const meRec = getMe();
  if(!theme || !meRec) return;
  const owned = meRec.ownedThemes || ['plain'];
  if(owned.includes(themeId)) return;

  let newXp = meRec.xp, newWeekly = meRec.weeklyXp;
  let discountApplied = 0;
  if(theme.currency === 'xp'){
    let cost = theme.cost;
    if(meRec.shopDiscountPct > 0){
      discountApplied = Math.round(cost * meRec.shopDiscountPct / 100);
      cost = Math.max(0, cost - discountApplied);
    }
    if(meRec.xp < cost) return;
    newXp -= cost; newWeekly -= cost;
  }
  // currency 'eur' themes are demo-only — no real payment is processed, unlocked directly for testing

  const newOwned = [...owned, themeId];
  const changes = {xp:newXp, weeklyXp:newWeekly, ownedThemes:newOwned, selectedTheme:themeId};
  if(meRec.shopDiscountPct > 0) changes.shopDiscountPct = 0; // Rabatt verbraucht
  await sSet(`dc:${S.code}:member:${identity.playerId}`, memberPayload(meRec, changes), true);
  meRec.xp = newXp; meRec.weeklyXp = newWeekly; meRec.ownedThemes = newOwned; meRec.selectedTheme = themeId; meRec.shopDiscountPct = 0;
  applyTheme(themeId);
  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat das Design „${theme.name}" freigeschaltet${discountApplied>0 ? ` (🎁 ${discountApplied} XP Bonus-Rabatt eingelöst)` : ''}${theme.demo ? ' (Demo — keine echte Zahlung)' : ''}.`);
  showToast(`🎨 ${theme.name} freigeschaltet`);
}

async function selectTheme(themeId){
  const meRec = getMe();
  if(!meRec) return;
  const owned = meRec.ownedThemes || ['plain'];
  if(!owned.includes(themeId)) return;
  await sSet(`dc:${S.code}:member:${identity.playerId}`, memberPayload(meRec, {selectedTheme:themeId}), true);
  meRec.selectedTheme = themeId;
  applyTheme(themeId);
}

async function buyPerk(perkId){
  const perk = PERKS.find(p => p.id === perkId);
  const meRec = getMe();
  const freeJokersLeft = perkId === 'joker' ? (meRec.freeJokers ?? 1) : 0;
  const usingFreeJoker = perkId === 'joker' && freeJokersLeft > 0;
  if(!perk || (!usingFreeJoker && meRec.xp < perk.cost)) return;
  const me = identity.playerId;
  const a = S.todayAssignments[me];

  if(perkId === 'shield'){
    await sSet(`dc:${S.code}:shield:${S.day}:${me}`, true, true);
  } else if(perkId === 'reroll'){
    if(!a || a.status !== 'active') return;
    if(a.task.poolTaskId){
      const old = S.pool.find(t => t.id === a.task.poolTaskId);
      if(old) await sSet(`dc:${S.code}:pool:${a.task.poolTaskId}`, {...old, status:'active'}, true);
    }
    const picked = pickTaskForMe(null);
    const updated = {...a, task: picked};
    await sSet(`dc:${S.code}:assign:${S.day}:${me}`, updated, true);
    if(picked.poolTaskId){
      const t = S.pool.find(x => x.id === picked.poolTaskId);
      if(t) await sSet(`dc:${S.code}:pool:${picked.poolTaskId}`, {...t, status:'assigned'}, true);
    }
  } else if(perkId === 'discount'){
    if(!a || a.status !== 'active') return;
    const order = ['hard','normal','easy'];
    const idx = order.indexOf(a.task.difficulty);
    if(idx === -1 || idx === order.length - 1) return;
    const newDiff = order[idx+1];
    const updated = {...a, task: {...a.task, difficulty:newDiff, points: DIFF[newDiff].points}};
    await sSet(`dc:${S.code}:assign:${S.day}:${me}`, updated, true);
  } else if(perkId === 'joker'){
    if(!a || a.status !== 'active') return;
    const updated = {...a, status:'resolved', result:'excused'};
    await sSet(`dc:${S.code}:assign:${S.day}:${me}`, updated, true);
  }

  if(usingFreeJoker){
    await sSet(`dc:${S.code}:member:${me}`, memberPayload(meRec, {freeJokers: freeJokersLeft - 1}), true);
    await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat seinen kostenlosen 🃏 Joker eingelöst.`);
    showToast(`🃏 Joker eingelöst — kostenlos`);
  } else {
    const updatedXp = meRec.xp - perk.cost, updatedWeekly = meRec.weeklyXp - perk.cost;
    await sSet(`dc:${S.code}:member:${me}`, memberPayload(meRec, {xp:updatedXp, weeklyXp:updatedWeekly}), true);
    await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat „${perk.icon} ${perk.label}" für ${perk.cost} XP gekauft.`);
    showToast(`${perk.icon} ${perk.label} aktiviert`);
  }
}

async function sendChatMessage(text){
  const meRec = getMe();
  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b>: ${esc(text)}`, 'chat', identity.playerId);
  if(otherPlayers().length > 0){
    sendPushNotification({
      excludePlayerId: identity.playerId,
      title: `💬 ${meRec.name}`,
      body: text.length > 120 ? text.slice(0, 117) + '…' : text
    });
  }
}

async function toggleReaction(logId, emoji){
  const key = `dc:${S.code}:reaction:${logId}:${identity.playerId}`;
  const entry = S.log.find(l => l.id === logId);
  if(!entry) return;
  entry.reactions = entry.reactions || {};
  if(entry.reactions[identity.playerId] === emoji){
    await sDelete(key, true);
    delete entry.reactions[identity.playerId];
  } else {
    await sSet(key, emoji, true);
    entry.reactions[identity.playerId] = emoji;
    // Autor benachrichtigen, falls bekannt (ältere Log-Einträge haben noch keine authorId)
    if(entry.authorId && entry.authorId !== identity.playerId){
      const meRec = getMe();
      sendPushNotification({
        onlyPlayerIds: [entry.authorId],
        title: `${emoji} ${meRec.name}`,
        body: `hat auf deine Nachricht reagiert`
      });
    }
  }
}

function resizeImageFile(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.6));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function poolSummaryCard(pool, icon, emptyText){
  if(pool.length === 0){
    return `<div class="empty-state"><span class="ic">${icon}</span>${emptyText}</div>`;
  }
  const easy = pool.filter(t => t.difficulty === 'easy').length;
  const normal = pool.filter(t => t.difficulty === 'normal').length;
  const hard = pool.filter(t => t.difficulty === 'hard').length;
  return `<div class="card" style="display:flex; align-items:center; gap:14px;">
    <div style="font-family:var(--font-display); font-weight:700; font-size:26px; color:var(--accent);">${pool.length}</div>
    <div style="flex:1;">
      <div class="hint" style="margin:0 0 6px;">Aufgabe${pool.length===1?'':'n'} — welche kommt, bleibt eine Überraschung.</div>
      <div class="chip-row">
        ${easy ? `<span class="chip" style="background:#E4F9EC; color:var(--success);">${easy}× Einfach</span>` : ''}
        ${normal ? `<span class="chip" style="background:#FFF3E4; color:var(--peach);">${normal}× Normal</span>` : ''}
        ${hard ? `<span class="chip" style="background:#FFE4E4; color:var(--danger);">${hard}× Schwer</span>` : ''}
      </div>
    </div>
  </div>`;
}

async function proposePunishment(text){
  if(!S.punishment) return;
  const id = genId();
  await sSet(`dc:${S.code}:punishprop:${S.punishment.weekNum}:${id}`, {text, authorId: identity.playerId}, true);
  const meRec = getMe();
  await pushLog(`${meRec.emoji} <b>${esc(meRec.name)}</b> hat eine Strafe vorgeschlagen: „${esc(text)}"`);
}

async function voteForPunishment(proposalId){
  if(!S.punishment) return;
  const week = S.punishment.weekNum;
  // remove any previous vote by me on another proposal this week
  for(const p of S.punishment.proposals){
    if(p.id !== proposalId && (S.punishment.votes[p.id]||[]).includes(identity.playerId)){
      await sDelete(`dc:${S.code}:punishvote:${week}:${p.id}:${identity.playerId}`, true);
    }
  }
  await sSet(`dc:${S.code}:punishvote:${week}:${proposalId}:${identity.playerId}`, true, true);
}

function renderCreate(){
  const area = document.getElementById('panel-create');
  const used = slotsUsedThisCycle();
  const free = Math.max(0, 2 - used);
  const daysToRefresh = 2 - ((S.day - 1) % 2);
  const pendingMine = myPendingCreations();

  const activePool = S.pool.filter(t => t.status==='active' && t.cycle===S.cycle);
  const parkedPool = S.pool.filter(t => t.status==='active' && t.cycle < S.cycle).sort((a,b)=>a.cycle-b.cycle);

  area.innerHTML = `
    <div class="section-title">Aufgaben erstellen<div class="rule"></div></div>
    <div class="card" id="tourCreateSlots">
      <div class="hint" style="margin-top:0;">Du hast alle 2 Tage 2 neue Erstell-Slots. Unbenutzte Aufgaben aus älteren Zyklen wandern automatisch in den Fallback-Pool.</div>
      <div class="slots-row" style="margin-top:14px;">
        ${[0,1].map(i => `<div class="slot-dot ${i < used ? 'filled':''}">${i < used ? '✏️' : '·'}</div>`).join('')}
      </div>
      <div class="hint" style="margin-top:0;">${free>0 ? `${free} von 2 Slots frei in diesem Zyklus.` : `Beide Slots verbraucht. Neue Slots in ${daysToRefresh} Tag(en).`}</div>
    </div>
    <div id="createFormArea"></div>

    <div class="section-title">Deine offenen Einreichungen<div class="rule"></div></div>
    ${pendingMine.length === 0
      ? `<div class="empty-state"><span class="ic">✅</span>Keine offenen Einreichungen.</div>`
      : pendingMine.map(e => `<div class="card"><div style="font-weight:700; font-size:14px; margin-bottom:4px;">${esc(e.task.title)}</div><div class="hint" style="margin:0;">Kategorie: ${esc(e.task.category)} · wird gerade anonym geprüft…</div></div>`).join('')}

    <div class="section-title">Aktiver Pool<div class="rule"></div></div>
    ${poolSummaryCard(activePool, '🗂️', 'Aktiver Pool ist leer.')}

    <div class="section-title">Fallback-Pool<div class="rule"></div></div>
    ${poolSummaryCard(parkedPool, '💤', 'Fallback-Pool ist leer.')}
  `;

  const formArea = document.getElementById('createFormArea');
  if(free <= 0){
    formArea.innerHTML = `<div class="empty-state"><span class="ic">🔒</span>Keine Erstell-Slots mehr in diesem Zyklus.</div>`;
    return;
  }
  formArea.innerHTML = `
    <div class="card">
      <label>Titel</label>
      <input type="text" id="ctTitle" placeholder="z. B. Ruf einen alten Freund an" maxlength="60">
      <label>Beschreibung (optional)</label>
      <textarea id="ctDesc" placeholder="Kurze Erklärung, falls nötig"></textarea>
      <label>Kategorie</label>
      <div class="chip-row" id="ctCatRow">${CATS.map(c=>`<div class="chip" data-cat="${c}">${c}</div>`).join('')}</div>
      <label>Nachweis-Typ</label>
      <div class="chip-row" id="ctProofRow">${PROOF_TYPES.map(p=>`<div class="chip" data-proof="${p[0]}">${p[1]}</div>`).join('')}</div>
      <div class="creator-note" style="margin-top:14px;">Schwierigkeit &amp; Punkte legt anonym ein anderes Mitglied beim Prüfen fest.</div>
      <button class="btn btn-accent" id="ctSubmit">Zur anonymen Prüfung einreichen</button>
    </div>`;
  let selCat=null, selProof=null;
  formArea.querySelector('#ctTitle').oninput = () => { createFormDirty = true; };
  formArea.querySelector('#ctDesc').oninput = () => { createFormDirty = true; };
  formArea.querySelectorAll('#ctCatRow .chip').forEach(c => c.onclick = () => {
    createFormDirty = true;
    formArea.querySelectorAll('#ctCatRow .chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selCat = c.dataset.cat;
  });
  formArea.querySelectorAll('#ctProofRow .chip').forEach(c => c.onclick = () => {
    createFormDirty = true;
    formArea.querySelectorAll('#ctProofRow .chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); selProof = c.dataset.proof;
  });
  formArea.querySelector('#ctSubmit').onclick = async () => {
    const title = formArea.querySelector('#ctTitle').value.trim();
    if(!title){ showToast('Bitte einen Titel eingeben'); return; }
    if(!selCat){ showToast('Bitte eine Kategorie wählen'); return; }
    if(!selProof){ showToast('Bitte einen Nachweis-Typ wählen'); return; }
    const desc = formArea.querySelector('#ctDesc').value.trim();
    formArea.querySelector('#ctSubmit').disabled = true;
    await createTask({title, desc, category:selCat, proofType:selProof});
    createFormDirty = false;
    await loadState(); render();
    showToast('Eingereicht — wartet auf anonyme Prüfung');
  };
}

function renderReview(){
  const area = document.getElementById('panel-review');
  const mine = myPendingReviews();
  const badge = document.getElementById('badgeReview');
  if(mine.length){ badge.style.display='inline-block'; badge.textContent = mine.length; } else { badge.style.display='none'; }

  area.innerHTML = `<div class="section-title" id="tourReview">Zu prüfen<div class="rule"></div></div><div id="reviewList"></div>`;
  const list = document.getElementById('reviewList');
  if(mine.length === 0){
    list.innerHTML = `<div class="empty-state"><span class="ic">🕶️</span>Aktuell nichts zu prüfen. Du siehst nie, wer die Aufgabe erstellt hat.</div>`;
    return;
  }
  list.innerHTML = mine.map(e => `
    <div class="review-card" id="rev-${e.id}">
      <div class="cat">${esc(e.task.category)} · Nachweis: ${proofLabel(e.task.proofType)}</div>
      <h4>${esc(e.task.title)}</h4>
      ${e.task.desc ? `<p>${esc(e.task.desc)}</p>` : ''}
      <div class="diff-picker">
        <div class="diff-btn easy" data-d="easy">Einfach<b>10</b></div>
        <div class="diff-btn normal" data-d="normal">Normal<b>25</b></div>
        <div class="diff-btn hard" data-d="hard">Schwer<b>50</b></div>
      </div>
      <button class="btn btn-teal" data-accept style="margin-bottom:8px;">Annehmen mit gewählter Schwierigkeit</button>
      <select class="reason-select" id="reason-${e.id}">
        <option value="">Ablehnungsgrund wählen…</option>
        <option>Zu schwierig</option><option>Zu einfach</option><option>Zu langweilig</option>
        <option>Nicht machbar</option><option>Unfair</option><option>Unangemessen</option>
        <option>Bereits vorhanden</option><option>Sonstiges</option>
      </select>
      <button class="btn btn-danger" data-reject>Ablehnen</button>
    </div>`).join('');

  mine.forEach(e => {
    const card = document.getElementById('rev-'+e.id);
    let picked = null;
    card.querySelectorAll('.diff-btn').forEach(b => b.onclick = () => {
      reviewFormDirty = true;
      card.querySelectorAll('.diff-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected'); picked = b.dataset.d;
    });
    card.querySelector('#reason-'+e.id).onchange = () => { reviewFormDirty = true; };
    card.querySelector('[data-accept]').onclick = async (ev) => {
      if(!picked){ showToast('Bitte zuerst eine Schwierigkeit wählen'); return; }
      ev.target.disabled = true;
      card.querySelector('[data-reject]').disabled = true;
      await resolveReview(e.id, true, picked, null);
      reviewFormDirty = false;
      await loadState(); render();
      showToast('Aufgabe angenommen ✅');
    };
    card.querySelector('[data-reject]').onclick = async (ev) => {
      const reason = card.querySelector('#reason-'+e.id).value;
      if(!reason){ showToast('Bitte einen Ablehnungsgrund wählen'); return; }
      ev.target.disabled = true;
      card.querySelector('[data-accept]').disabled = true;
      await resolveReview(e.id, false, null, reason);
      reviewFormDirty = false;
      await loadState(); render();
      showToast('Aufgabe abgelehnt ❌');
    };
  });
}

function renderVote(){
  const area = document.getElementById('panel-vote');
  const pending = pendingVotesForMe();
  const badge = document.getElementById('badgeVote');
  const notYetVoted = pending.filter(pv => !(pv.assignment.votes && pv.assignment.votes[identity.playerId]));
  if(notYetVoted.length){ badge.style.display='inline-block'; badge.textContent = notYetVoted.length; } else { badge.style.display='none'; }

  area.innerHTML = `<div class="section-title" id="tourVote">Abstimmen<div class="rule"></div></div><div id="voteList"></div>`;
  const list = document.getElementById('voteList');
  if(pending.length === 0){
    list.innerHTML = `<div class="empty-state"><span class="ic">🗳️</span>Aktuell steht nichts zur Abstimmung an.</div>`;
    return;
  }
  list.innerHTML = pending.map(pv => {
    const p = S.players.find(x => x.id === pv.playerId);
    const votes = pv.assignment.votes || {};
    const yes = Object.values(votes).filter(v=>v==='yes').length;
    const no = Object.values(votes).filter(v=>v==='no').length;
    const eligible = S.players.filter(x => x.id !== pv.playerId).length;
    const collected = yes + no;
    const myVote = votes[identity.playerId] || null;
    const avatars = S.players.filter(x => x.id !== pv.playerId).map(v => {
      const vt = votes[v.id];
      const cls = vt==='yes' ? 'yes' : (vt==='no' ? 'no' : 'pending');
      return `<div class="vavatar ${cls}" title="${esc(v.name)}: ${vt||'wartet'}">${v.emoji}</div>`;
    }).join('');
    return `<div class="vote-card" id="vote-${pv.playerId}">
      <div class="meta">${p ? p.emoji + ' ' + esc(p.name) : 'Jemand'} · Hat die Aufgabe erledigt?</div>
      <h4>${esc(pv.assignment.task.title)}</h4>
      ${pv.assignment.proof ? (pv.assignment.proof.startsWith('data:image') ? `<img src="${esc(pv.assignment.proof)}" style="max-width:100%; border-radius:12px; margin:6px 0 12px; display:block;">` : `<p style="font-size:12.5px; color:var(--text-dim); margin:6px 0 12px;">Nachweis: „${esc(pv.assignment.proof)}"</p>`) : ''}
      <div class="vote-choice">
        <button class="btn btn-teal ${myVote==='yes' ? 'selected-vote' : ''}" data-vote="yes">Ja, erledigt${myVote==='yes' ? ' ✓' : ''}</button>
        <button class="btn btn-danger ${myVote==='no' ? 'selected-vote' : ''}" data-vote="no">Nein${myVote==='no' ? ' ✓' : ''}</button>
      </div>
      <div class="vote-box" style="border-top:none; padding-top:12px;">
        <div class="vote-row" style="color:var(--text-faint);"><span>${yes} Ja</span><span>${collected}/${eligible} abgestimmt</span><span>${no} Nein</span></div>
        <div class="vote-avatars">${avatars}</div>
        ${myVote ? `<div class="hint" style="margin-top:8px;">Du hast abgestimmt — du kannst deine Wahl noch ändern.</div>` : ''}
      </div>
    </div>`;
  }).join('');

  pending.forEach(pv => {
    const card = document.getElementById('vote-'+pv.playerId);
    card.querySelectorAll('[data-vote]').forEach(b => b.onclick = async () => {
      card.querySelectorAll('[data-vote]').forEach(x => x.disabled = true);
      await castVote(pv.playerId, b.dataset.vote);
      await loadState(); render();
    });
  });
}

let rankPeriod = 'all';
let createFormDirty = false;
let reviewFormDirty = false;
let chatInputDirty = false;
function renderRanking(){
  const area = document.getElementById('panel-ranking');
  const sorted = [...S.players].sort((a,b) => rankPeriod==='all' ? b.xp-a.xp : b.weeklyXp-a.weeklyXp);
  area.innerHTML = `
    <div class="section-title" id="tourRanking">Rangliste<div class="rule"></div></div>
    <div class="period-toggle">
      <button class="${rankPeriod==='all'?'active':''}" data-period="all">Gesamt</button>
      <button class="${rankPeriod==='week'?'active':''}" data-period="week">Diese Woche</button>
    </div>
    <div class="card">
      ${sorted.map((p,i) => `<div class="rank-row ${p.id===identity.playerId?'me':''}"><div class="rank-num">${i+1}</div><div class="rank-avatar" style="overflow:hidden;">${avatarInner(p)}</div><div class="rank-name">${esc(p.name)}${p.title ? ` <span title="${esc(p.title.label)}">${p.title.emoji}</span>` : ''}</div><div class="rank-xp">${rankPeriod==='all'?p.xp:p.weeklyXp} XP</div></div>`).join('')}
    </div>
    ${renderPunishmentSection()}`;
  area.querySelectorAll('.period-toggle button').forEach(b => b.onclick = () => { rankPeriod = b.dataset.period; renderRanking(); });
  const propInput = document.getElementById('punishPropInput');
  const propBtn = document.getElementById('punishPropBtn');
  if(propBtn) propBtn.onclick = async () => {
    const text = propInput.value.trim();
    if(!text) return;
    propBtn.disabled = true;
    await proposePunishment(text);
    await loadState(); renderRanking();
  };
  area.querySelectorAll('[data-vote-punish]').forEach(btn => btn.onclick = async () => {
    btn.disabled = true;
    await voteForPunishment(btn.dataset.votePunish);
    await loadState(); renderRanking();
  });
}

function renderPunishmentSection(){
  if(!S.punishment) return '';
  const target = S.players.find(p => p.id === S.punishment.targetId);
  if(!target) return '';
  const proposals = [...S.punishment.proposals].sort((a,b) => (S.punishment.votes[b.id]||[]).length - (S.punishment.votes[a.id]||[]).length);
  const myVote = proposals.find(p => (S.punishment.votes[p.id]||[]).includes(identity.playerId));
  const maxVotes = proposals.length ? Math.max(...proposals.map(p => (S.punishment.votes[p.id]||[]).length)) : 0;
  return `
    <div class="section-title">😈 Strafe der Woche<div class="rule"></div></div>
    <div class="card">
      <div class="hint" style="margin:0 0 12px;">${target.emoji} <b style="color:var(--text);">${esc(target.name)}</b> war Schlusslicht letzte Woche — die Gruppe stimmt ab, welche echte Strafe fällig wird.</div>
      ${proposals.length === 0 ? `<div class="hint">Noch keine Vorschläge — sei der/die Erste.</div>` : proposals.map(p => {
        const votes = (S.punishment.votes[p.id]||[]).length;
        const isLeading = votes > 0 && votes === maxVotes;
        const isMine = myVote && myVote.id === p.id;
        return `<div class="card" style="margin-bottom:8px; ${isLeading ? 'border-color:var(--accent);' : ''}">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <div style="flex:1; font-size:13px;">${esc(p.text)}${isLeading ? ' 🏆' : ''}</div>
            <button class="btn ${isMine?'btn-primary':'btn-ghost'}" data-vote-punish="${p.id}" style="width:auto; padding:7px 12px; font-size:11px;">${votes} ${isMine?'✓':''}</button>
          </div>
        </div>`;
      }).join('')}
      <label style="margin-top:14px;">Eigenen Vorschlag einreichen</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="punishPropInput" placeholder="z. B. gibt allen einen aus" maxlength="120" style="flex:1;">
        <button class="btn btn-accent" id="punishPropBtn" style="width:auto; padding:11px 16px;">+</button>
      </div>
    </div>`;
}

/* ---------------- boot ---------------- */

async function boot(){
  if(!identity){ await renderEntryScreen(); return; }
  // Ladebildschirm bleibt bewusst stehen, bis die Daten wirklich da sind —
  // renderShell() (Header/Tabs/leere Panels) kommt erst direkt vor render(),
  // damit niemand ein halb-leeres Grundgerüst zu sehen bekommt.
  setLoadProgress(10);
  identityInvalidated = false;
  await loadState();
  if(identityInvalidated){ identityInvalidated = false; return; } // renderOnboarding() lief schon in loadStateImpl()
  if(!S){
    await new Promise(r => setTimeout(r, 1000));
    await loadState();
    if(identityInvalidated){ identityInvalidated = false; return; }
  }
  if(!S){
    document.getElementById('app').innerHTML = `
      <div class="onboard"><div class="onboard-card">
        <div class="onboard-title">DAILY <span>CHALLENGE</span></div>
        <div class="empty-state" style="margin-top:20px;">
          <span class="ic">⚠️</span>
          Gruppendaten konnten nicht geladen werden — Cloud-Speicher gerade nicht erreichbar.
        </div>
        <button class="btn btn-accent" id="retryBoot" style="margin-top:14px;">Erneut versuchen</button>
      </div></div>`;
    document.getElementById('retryBoot').onclick = () => location.reload();
    return;
  }
  setLoadProgress(100);
  renderShell();
  render();
  if(isSupabase()) setupSupabaseRealtime();
  autoEnablePushNotifications();
  await maybeShowTutorial();
  if(pollTimer) clearTimeout(pollTimer);
  schedulePoll();
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(async () => {
    const el = document.getElementById('countdownText');
    if(!el) return;
    const ms = msUntilNextMidnight();
    el.textContent = formatCountdown(ms);
    if(!document.hidden && ms <= 1500){
      await loadState();
      render();
    }
  }, 1000);
}

async function storageSelfTest(){
  if(HAS_CLAUDE_STORAGE){
    try{
      const k = 'dc:_selftest:' + genId();
      await sSet(k, {ping:'pong'}, true);
      const back = await sGet(k, true);
      return !!(back && back.ping === 'pong');
    }catch(e){ return false; }
  }
  try{
    const k = '_selftest_' + genId();
    localStorage.setItem(k, 'pong');
    const ok = localStorage.getItem(k) === 'pong';
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}

window.addEventListener('storage', async (e) => {
  if(!identity || !S || document.hidden || groupModalOpen) return;
  if(e.key && !e.key.startsWith(`dc:${identity.code}:`)) return;
  await loadState();
  render();
});

document.addEventListener('visibilitychange', async () => {
  if(!document.hidden && identity && S && !groupModalOpen){
    await loadState();
    render();
  }
});

if(hasSupabase()){
  getSb().auth.onAuthStateChange((event) => {
    if((event === 'SIGNED_IN' || event === 'SIGNED_OUT') && !identity){ renderEntryScreen(); }
  });
}

(async () => {
  await loadIdentity();
  if(!identity){
    const ok = await storageSelfTest();
    if(!ok){
      document.getElementById('app').innerHTML = `
        <div class="onboard"><div class="onboard-card">
          <div class="onboard-title">DAILY <span>CHALLENGE</span></div>
          <div class="empty-state" style="margin-top:20px;">
            <span class="ic">⚠️</span>
            ${HAS_CLAUDE_STORAGE ? 'Der geteilte Speicher antwortet gerade nicht.' : 'Dein Browser blockiert gerade lokalen Speicher (z. B. Privater Modus).'}<br><br>
            Das ist kein Tippfehler-Problem beim Code — versuch es gleich noch einmal${HAS_CLAUDE_STORAGE ? '' : ', am besten in einem normalen Browserfenster (nicht privat/inkognito)'}.
          </div>
          <button class="btn btn-ghost" id="retryTest" style="margin-top:14px;">Erneut versuchen</button>
        </div></div>`;
      document.getElementById('retryTest').onclick = () => location.reload();
      return;
    }
  }
  await boot();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(e => console.error('Service-Worker-Registrierung fehlgeschlagen', e));
  });
}
